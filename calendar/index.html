<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EZPayouts Calendar</title>
<link rel="icon" type="image/png" href="../ezpayouts-icon-only.png">
<link rel="apple-touch-icon" href="../ezpayouts-icon-only.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --void:#07090a;
    --panel:#0c1310;
    --panel-raised:#121b16;
    --panel-hi:#182319;
    --hairline:#23332a;
    --hairline-bright:#345a44;
    --phosphor:#3ee08c;
    --phosphor-soft:#8fe6b6;
    --phosphor-dim:#1c5c3d;
    --phosphor-glow:rgba(62,224,140,0.35);
    --mint:#7ee8ac;
    --mint-text:#062b17;
    --red:#ef5a5a;
    --red-glow:rgba(239,90,90,0.35);
    --amber:#e8c34a;
    --amber-glow:rgba(232,195,74,0.35);
    --ice:#dcefe2;
    --muted:#7c9584;
    --muted-dim:#4d6055;
    --font-display:'Chakra Petch', 'Segoe UI', sans-serif;
    --font-body:'IBM Plex Sans', 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }

  *{box-sizing:border-box;}
  html{color-scheme:dark; height:100%;}
  /* The page scrolls whenever it's taller than the screen (a phone on its
     side, a short laptop window). Only the Economic Calendar pins itself
     to the window, and only on screens big enough for its own scrolling
     agenda (see .econ-agenda). */
  body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(62,224,140,0.10), transparent 60%),
      radial-gradient(ellipse 80% 50% at 100% 100%, rgba(62,224,140,0.06), transparent 60%),
      var(--void);
    color:var(--ice);
    font-family:var(--font-body);
    padding-inline:clamp(10px,1.4vw,18px);
    padding-block:12px 12px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(62,224,140,0.035) 0px,
      rgba(62,224,140,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
    z-index:0;
    animation:scan 9s linear infinite;
  }
  @keyframes scan{
    0%{ background-position:0 0; }
    100%{ background-position:0 120px; }
  }
  @media (prefers-reduced-motion: reduce){
    body::before{ animation:none; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .wrap{
    width:100%; position:relative; z-index:1;
    flex:1; min-height:0; display:flex; flex-direction:column;
  }

  h1,h2{ font-family:var(--font-display); text-wrap:balance; margin:0; }
  a{ color:var(--phosphor-soft); }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  .cal-head{ flex:none; padding:22px 0 16px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }

  .ghost-btn{
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--font-display); font-weight:600; font-size:12.5px; white-space:nowrap;
    padding:9px 15px; border-radius:10px; border:1px solid var(--hairline-bright);
    background:var(--panel-raised); color:var(--ice); cursor:pointer; transition:border-color .15s, background .15s;
  }
  .ghost-btn:hover{ border-color:var(--phosphor-dim); background:var(--panel-hi); }
  .ghost-btn svg{ width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- Trading-account filter (checkboxes; shown only on the P&L
     view, which is the only one that reads journal trade data) ---------- */
  .acct-filter{ position:relative; }
  .acct-filter[hidden]{ display:none; }
  #acctFilterBtn svg.chev{ width:11px; height:11px; margin-left:-1px; opacity:0.7; }
  #acctFilterLabel{ max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acct-filter-popover{
    position:absolute; top:calc(100% + 8px); right:0; z-index:60; width:230px;
    background:var(--panel-raised); border:1px solid var(--hairline-bright); border-radius:14px;
    padding:8px; box-shadow:0 20px 44px -18px rgba(0,0,0,0.65);
  }
  .acct-filter-popover[hidden]{ display:none; }
  .acct-filter-row{
    display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; cursor:pointer;
    font-family:var(--font-body); font-size:13px; color:var(--ice); transition:background .12s;
  }
  .acct-filter-row:hover{ background:var(--panel-hi); }
  .acct-filter-row input[type="checkbox"]{ width:15px; height:15px; accent-color:var(--phosphor); flex:none; }
  .acct-filter-all-row{ font-weight:600; }
  .acct-filter-divider{ height:1px; background:var(--hairline); margin:6px 4px; }
  .acct-filter-list{ max-height:240px; overflow-y:auto; }
  .acct-filter-empty{ padding:10px; font-size:12px; color:var(--muted); text-align:center; }
  .acct-filter-count{ margin-left:auto; font-family:var(--font-mono); font-size:10px; color:var(--muted); flex:none; }

  /* ---------- Economic Calendar ----------
     Up next (live countdown) + the week at a glance, a day strip, then an
     agenda grouped by day that scrolls inside the panel. */
  .econ-top{ flex:none; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:14px; margin-bottom:14px; }
  .econ-card{
    background:var(--panel); border:1px solid var(--hairline); border-radius:18px;
    box-shadow:0 18px 40px -30px rgba(0,0,0,0.9);
  }
  .econ-next{ position:relative; overflow:hidden; padding:18px 22px; display:flex; flex-direction:column; gap:10px; min-height:150px; }
  .econ-next::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 70% 120% at 100% 0%, rgba(var(--ez-accent-rgb, 62,224,140),0.14), transparent 60%);
  }
  .econ-next.is-high::before{ background:radial-gradient(ellipse 70% 120% at 100% 0%, rgba(239,90,90,0.16), transparent 60%); }
  .econ-eyebrow{ display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:10.5px; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); position:relative; }
  .econ-next-main{ position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; }
  .econ-next-title{ font-family:var(--font-display); font-weight:700; font-size:clamp(19px,2vw,26px); line-height:1.15; color:var(--ice); }
  .econ-next-when{ margin-top:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:var(--font-mono); font-size:12px; color:var(--muted); }
  .econ-countdown{ text-align:right; flex:none; }
  .econ-countdown-value{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:700; font-size:clamp(22px,2.4vw,30px); color:var(--ice); letter-spacing:0.02em; }
  .econ-countdown-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted-dim); margin-top:2px; }
  .econ-next-about{ position:relative; margin:0; max-width:62ch; font-size:13px; line-height:1.55; color:var(--muted);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .econ-next-stats{ position:relative; margin-top:auto; display:flex; gap:22px; flex-wrap:wrap; font-family:var(--font-mono); font-size:11.5px; color:var(--muted); }
  .econ-next-stats strong{ color:var(--ice); font-weight:600; margin-left:6px; }
  .econ-next-empty{ position:relative; color:var(--muted); font-size:13.5px; line-height:1.6; }

  .econ-week{ padding:16px 18px; display:flex; flex-direction:column; gap:12px; min-width:0; }
  .econ-week-counts{ display:flex; gap:8px; }
  .econ-count{ flex:1; border:1px solid var(--hairline); border-radius:12px; padding:9px 11px; background:rgba(0,0,0,0.18); }
  .econ-count-value{ font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--ice); line-height:1; }
  .econ-count-label{ display:flex; align-items:center; gap:6px; margin-top:6px; font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
  .econ-key-list{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .econ-key{ display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:9px; cursor:pointer; min-width:0;
    background:transparent; border:none; color:var(--ice); text-align:left; font:inherit; }
  .econ-key:hover{ background:var(--panel-hi); }
  .econ-key-when{ flex:none; width:96px; font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .econ-key-title{ flex:1; min-width:0; font-family:var(--font-display); font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .econ-key.past{ opacity:0.45; }

  /* Impact: three signal bars, lit by level. */
  .econ-impact{ display:inline-flex; align-items:flex-end; gap:2px; height:13px; flex:none; }
  .econ-impact i{ display:block; width:3px; border-radius:2px; background:var(--hairline-bright); }
  .econ-impact i:nth-child(1){ height:5px; } .econ-impact i:nth-child(2){ height:9px; } .econ-impact i:nth-child(3){ height:13px; }
  .econ-impact.low i:nth-child(-n+1){ background:var(--muted); }
  .econ-impact.medium i:nth-child(-n+2){ background:var(--amber); box-shadow:0 0 6px var(--amber-glow); }
  .econ-impact.high i{ background:var(--red); box-shadow:0 0 6px var(--red-glow); }
  .econ-impact.holiday i{ background:var(--muted-dim); height:9px; }
  .econ-impact-label{ font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; }
  .econ-impact-label.high{ color:var(--red); } .econ-impact-label.medium{ color:var(--amber); } .econ-impact-label.low, .econ-impact-label.holiday{ color:var(--muted); }

  .econ-ccy{
    display:inline-flex; align-items:center; gap:6px; flex:none; font-family:var(--font-mono); font-size:11px; font-weight:700;
    letter-spacing:0.04em; color:var(--ice); padding:3px 8px 3px 7px; border-radius:7px; border:1px solid var(--hairline-bright); background:rgba(0,0,0,0.22);
  }
  .econ-ccy::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--ccy, var(--muted)); box-shadow:0 0 6px var(--ccy, transparent); }

  .econ-toolbar{ flex:none; display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .econ-days{ display:flex; gap:6px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .econ-days::-webkit-scrollbar{ display:none; }
  .econ-day-btn{
    flex:1; min-width:64px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 6px 8px;
    border-radius:12px; border:1px solid var(--hairline); background:var(--panel); color:var(--muted); cursor:pointer;
    transition:border-color .15s, background .15s, color .15s;
  }
  .econ-day-btn:hover{ border-color:var(--hairline-bright); color:var(--ice); }
  .econ-day-btn .dn{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; }
  .econ-day-btn .dd{ font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--ice); line-height:1; }
  .econ-day-btn .dm{ display:flex; gap:2px; height:4px; }
  .econ-day-btn .dm i{ width:4px; height:4px; border-radius:50%; background:var(--red); }
  .econ-day-btn .dm i.m{ background:var(--amber); }
  .econ-day-btn.today{ border-color:var(--ez-accent, var(--phosphor)); }
  .econ-day-btn.current{ background:var(--panel-hi); border-color:var(--hairline-bright); color:var(--ice); }
  .econ-day-btn.today.current{ border-color:var(--ez-accent, var(--phosphor)); box-shadow:0 0 0 1px var(--ez-accent, var(--phosphor)) inset; }
  .econ-filters{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .econ-chip{
    display:flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:11.5px; color:var(--muted); white-space:nowrap;
    background:transparent; border:1px solid var(--hairline); border-radius:999px; padding:6px 12px 6px 10px; cursor:pointer;
    transition:border-color .15s, color .15s, background .15s, opacity .15s;
  }
  .econ-chip:hover{ border-color:var(--hairline-bright); color:var(--ice); }
  .econ-chip.active{ color:var(--ice); background:var(--panel-raised); border-color:var(--hairline-bright); }
  .econ-chip:not(.active){ opacity:0.5; }
  .econ-chip b{ font-weight:600; color:var(--muted-dim); }

  .econ-agenda{ flex:1; min-height:0; overflow-y:auto; position:relative; padding:0 0 10px; }
  .econ-agenda::-webkit-scrollbar{ width:6px; }
  .econ-agenda::-webkit-scrollbar-thumb{ background:var(--hairline-bright); border-radius:999px; }
  .econ-cols, .econ-row{
    display:grid; grid-template-columns:86px 74px 66px minmax(0,1fr) repeat(var(--econ-num-cols, 2), 92px) 18px;
    align-items:center; column-gap:12px;
  }
  .econ-cols{ padding:0 16px 8px; font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted-dim); }
  .econ-cols .num, .econ-row .num{ text-align:right; }
  .econ-section{ margin-bottom:12px; background:var(--panel); border:1px solid var(--hairline); border-radius:16px; overflow:hidden; }
  .econ-section.today{ border-color:var(--hairline-bright); box-shadow:0 18px 40px -30px rgba(var(--ez-accent-rgb, 62,224,140),0.6); }
  .econ-section-head{
    position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px; padding:11px 16px;
    background:var(--panel-raised); border-bottom:1px solid var(--hairline);
  }
  .econ-section-day{ font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ice); }
  .econ-section-date{ font-family:var(--font-mono); font-size:12px; color:var(--muted); }
  .econ-section-meta{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--muted-dim); }
  .econ-today-badge{ font-family:var(--font-mono); font-size:9.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; color:var(--mint-text); background:var(--mint); }
  .econ-row{
    width:100%; padding:11px 16px; background:transparent; border:none; border-top:1px solid var(--hairline); color:var(--ice);
    text-align:left; cursor:pointer; font:inherit; transition:background .12s;
  }
  .econ-section-head + .econ-row{ border-top:none; }
  .econ-row:hover, .econ-row:focus-visible{ background:var(--panel-hi); outline:none; }
  .econ-row.past{ opacity:0.5; }
  .econ-row.past:hover{ opacity:0.85; }
  .econ-row.is-high{ box-shadow:inset 3px 0 0 var(--red); }
  .econ-time{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px; font-weight:600; color:var(--ice); }
  .econ-impact-cell{ display:flex; align-items:center; gap:8px; }
  .econ-title{ font-family:var(--font-display); font-weight:600; font-size:14px; line-height:1.3; min-width:0; }
  .econ-title small{ display:none; }
  .econ-row .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ice); }
  .econ-row .num.dim{ color:var(--muted-dim); }
  .econ-chev{ width:14px; height:14px; color:var(--muted-dim); }
  .econ-chev svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .econ-day-empty{ padding:14px 16px; font-size:12.5px; color:var(--muted-dim); }
  .econ-now{ display:flex; align-items:center; height:22px; padding:0 16px; position:relative; border-top:1px solid var(--hairline); }
  .econ-now::before{ content:""; position:absolute; left:0; right:0; top:50%; height:2px; margin-top:-1px;
    background:var(--ez-accent, var(--phosphor)); box-shadow:0 0 10px rgba(var(--ez-accent-rgb, 62,224,140),0.7); }
  .econ-now span{ position:relative; font-family:var(--font-mono); font-size:9.5px; font-weight:700; letter-spacing:0.12em;
    padding:2px 8px; border-radius:999px; color:var(--mint-text); background:var(--ez-accent, var(--phosphor)); }
  .econ-now + .econ-row{ border-top:none; }
  .econ-message{ padding:40px 20px; text-align:center; color:var(--muted); font-size:13.5px; line-height:1.6; }
  .econ-message button{ margin-top:12px; font-family:var(--font-display); font-weight:600; font-size:13px; padding:9px 18px; border-radius:10px;
    background:var(--panel-raised); border:1px solid var(--hairline-bright); color:var(--ice); cursor:pointer; }
  .econ-message button:hover{ border-color:var(--ez-accent, var(--phosphor)); }
  .econ-skeleton{ height:44px; margin:8px 16px; border-radius:10px;
    background:linear-gradient(90deg, var(--panel-raised) 0%, var(--panel-hi) 50%, var(--panel-raised) 100%); background-size:200% 100%;
    animation:econShimmer 1.4s ease-in-out infinite; }
  @keyframes econShimmer{ 0%{ background-position:100% 0; } 100%{ background-position:-100% 0; } }
  .econ-tz{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted-dim); white-space:nowrap; }

  @media (max-width:980px){
    .econ-top{ grid-template-columns:1fr; }
    .econ-week{ display:none; }
  }
  @media (max-width:720px){
    .econ-cols{ display:none; }
    .econ-row{ grid-template-columns:62px minmax(0,1fr) 18px; row-gap:6px; align-items:start; }
    .econ-row .econ-impact-cell, .econ-row .econ-ccy-cell, .econ-row .num{ display:none; }
    .econ-title small{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:5px; font-family:var(--font-mono); font-size:11px; font-weight:400; color:var(--muted); }
    .econ-next{ padding:16px; min-height:0; }
    .econ-next-main{ flex-wrap:nowrap; align-items:flex-start; }
    .econ-countdown-value{ font-size:20px; }
    .econ-next-about{ font-size:12.5px; }
    .econ-day-btn{ min-width:52px; }
    .econ-section-head{ flex-wrap:wrap; row-gap:4px; padding:10px 14px; }
    .econ-section-date, .econ-section-meta{ white-space:nowrap; }
    .econ-section-meta{ flex-basis:100%; margin-left:0; }
    .econ-row{ padding:11px 14px; }
  }
  @media (min-width:721px) and (min-height:641px){
    body.econ-active{ height:100vh; overflow:hidden; }
  }
  /* Phones either way up and short windows: the page scrolls as a whole
     instead of a small inner box. */
  @media (max-width:720px), (max-height:640px){
    body.econ-active .wrap, body.econ-active #econView{ flex:none; }
    body.econ-active .econ-agenda{ overflow:visible; flex:none; }
  }
  .cal-event-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .cal-event-dot.high{ background:var(--red); box-shadow:0 0 6px 1px var(--red-glow); }
  .cal-event-dot.medium{ background:var(--amber); box-shadow:0 0 6px 1px var(--amber-glow); }
  .cal-event-dot.low{ background:var(--muted-dim); }

  /* ---------- Event detail modal ---------- */
  .cal-overlay{
    display:none; position:fixed; inset:0; z-index:700; background:rgba(4,7,6,0.72);
    align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(2px);
  }
  .cal-overlay.open{ display:flex; }
  .cal-modal{
    width:100%; max-width:420px; max-height:calc(100vh - 48px); overflow-y:auto;
    background:var(--panel-raised); border:1px solid var(--hairline-bright); border-radius:16px;
    padding:20px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), 0 0 30px -10px var(--phosphor-glow);
  }
  .cal-modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--hairline); margin-bottom:14px; }
  .cal-modal-title{ font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--ice); line-height:1.3; }
  .cal-modal-head-right{ display:flex; align-items:center; gap:10px; flex:none; }
  .cal-modal-impact{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--muted); white-space:nowrap; }
  .cal-modal-impact .cal-event-dot{ margin-top:0; }
  .cal-modal-impact.high{ color:var(--red); }
  .cal-modal-impact.medium{ color:var(--amber); }
  .cal-modal-close{

  .cal-modal-about p{ margin:0; font-size:13px; color:var(--muted); line-height:1.6; }

  .cal-modal-close-btn{
    font-family:var(--font-display); font-weight:600; font-size:13px; padding:9px 20px;
    border-radius:10px; background:var(--panel-hi); border:1px solid var(--hairline-bright);
    color:var(--ice); cursor:pointer; transition:border-color .15s, background .15s;
  }
  .cal-modal-close-btn:hover{ border-color:var(--phosphor-dim); background:var(--mint); color:var(--mint-text); }


  .cal-view-panel{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .cal-view-panel[hidden]{ display:none; }

  /* ---------- P&L Calendar ----------
     Its own exact palette per spec — a solid card-grid aesthetic, not
     the site's usual flat/transparent panel language. Scoped to #pnlView
     so the rest of the chrome (sidebar, camera menu) stays on-brand. */
  #pnlView{
    --pnl-accent:var(--ez-pnl-accent, #2d5bff); --pnl-accent-soft:var(--ez-accent-soft, #8fa8ff); --pnl-accent-glow:rgba(var(--ez-accent-rgb, 45,91,255),0.18);
    --pnl-bg:var(--ez-pnl-bg, #0d0f1a); --pnl-border:var(--ez-pnl-border, #22253f);
    --pnl-cell-bg:var(--ez-pnl-cell, #131527); --pnl-cell-border:var(--ez-pnl-cell-border, #1c1f35);
    --pnl-cell-active-bg:var(--ez-pnl-cell-active, #191c32);
    --pnl-text-muted:#6b7280; --pnl-text-dim:#3a3d52;
    --pnl-pnl-color:#53ba79;
  }
  /* Exact port of PnlCalendar.tsx (the reference app's real source), not
     an approximation — colors/spacing/structure match it 1:1 where our
     stack (vanilla CSS vs. Tailwind) allows. */
  .pnl-body{
    border-radius:16px; border:1px solid var(--hairline-bright); padding:16px;
    background:linear-gradient(to bottom, var(--ez-cal-top), var(--ez-cal-bottom));
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .pnl-toolbar{
    flex:none; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:16px;
  }
  .pnl-mode-switch{
    display:inline-flex; border-radius:12px; border:1px solid var(--hairline-bright); background:var(--ez-cal-well); padding:4px;
  }
  .pnl-mode-switch button{
    font-family:var(--font-body); font-size:13px; font-weight:500; padding:6px 12px;
    background:transparent; border:none; border-radius:8px; color:var(--muted); cursor:pointer; transition:background .15s, color .15s;
    white-space:nowrap;
  }
  .pnl-mode-switch button:hover{ color:#fff; }
  .pnl-mode-switch button.active{ color:var(--mint-text); background:var(--mint); box-shadow:0 0 14px rgba(var(--ez-focus-rgb),0.6); }
  .pnl-mode-switch button.active:hover{ color:#fff; }
  .pnl-nav{ display:flex; align-items:center; gap:8px; }
  .pnl-nav-btn{
    width:30px; height:30px; padding:6px; cursor:pointer; flex:none; border-radius:8px;
    background:transparent; border:none; color:var(--ez-btn-text);
    display:flex; align-items:center; justify-content:center; transition:background .15s;
  }
  .pnl-nav-btn:hover{ background:var(--panel-hi); }
  .pnl-nav-btn svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .pnl-period-label{
    font-family:var(--font-body); font-weight:600; font-size:14px; color:#fff;
    min-width:150px; text-align:center; cursor:pointer; border-radius:8px; padding:4px 8px; transition:color .15s;
  }
  .pnl-period-label:hover{ color:var(--ez-cal-icon, #93c5fd); }

  .pnl-camera-wrap{ position:relative; }
  .pnl-camera-btn{
    width:34px; height:34px; border-radius:8px; padding:8px; cursor:pointer;
    background:var(--panel-hi); border:1px solid var(--hairline-bright); color:var(--ez-btn-text);
    display:flex; align-items:center; justify-content:center; transition:box-shadow .2s;
  }
  .pnl-camera-btn:hover{ box-shadow:0 0 14px rgba(var(--ez-focus-rgb),0.5); }
  .pnl-camera-btn svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .pnl-camera-menu{
    position:absolute; top:calc(100% + 8px); right:0; z-index:60; width:256px;
    background:var(--ez-cal-well); border:1px solid var(--hairline-bright); border-radius:12px; overflow:hidden;
    box-shadow:0 20px 44px -18px rgba(0,0,0,0.8);
  }
  .pnl-camera-menu[hidden]{ display:none; }
  .pnl-camera-menu button{
    width:100%; display:flex; align-items:center; gap:10px; text-align:left;
    background:transparent; border:none; padding:13px 14px; cursor:pointer;
    font-family:var(--font-body); font-size:13.5px; font-weight:500; color:#e2e8f0; transition:background .12s;
  }
  .pnl-camera-menu button + button{ border-top:1px solid var(--ez-cal-cell-border); }
  .pnl-camera-menu button:hover{ background:var(--panel-hi); }
  .pnl-camera-menu button svg{ width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; color:var(--ez-cal-icon, #93c5fd); }
  .pnl-camera-toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(0); z-index:900;
    background:var(--panel-hi); border-radius:10px;
    padding:10px 18px; font-family:var(--font-body); font-size:13px; color:#fff;
    box-shadow:0 20px 44px -18px rgba(0,0,0,0.7); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .pnl-camera-toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .pnl-weekday-head{ display:grid; grid-template-columns:repeat(7, 1fr); gap:8px; flex:none; margin-bottom:8px; }
  .pnl-weekday-head span{ font-family:var(--font-body); font-size:12px; color:var(--muted-dim); text-align:center; }

  .pnl-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:8px; }
  .pnl-grid[hidden], .pnl-weekday-head[hidden]{ display:none; }

  .pnl-day{
    min-height:84px; display:flex; flex-direction:column; text-align:left;
    border-radius:12px; border:1px solid var(--ez-cal-cell-border); background:var(--ez-cal-cell);
    padding:8px; font-family:var(--font-body); font-size:12px; color:var(--muted-dim);
    position:relative; cursor:pointer;
    transition:background .2s, border-color .2s, box-shadow .2s, transform .2s;
  }
  .pnl-grid.week-view .pnl-day{ min-height:120px; }
  .pnl-day.outside{ visibility:hidden; cursor:default; }
  .pnl-day:not(.outside):hover{ transform:translateY(-2px); border-color:var(--ez-cal-cell-hover); }
  .pnl-day.has-data{
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12), 0 2px 6px rgba(0,0,0,0.35);
  }
  /* Winning days take the theme's win color (nav.js): blue in Inked
     Japan, green in the others so they never read like the rose losses. */
  .pnl-day.win{
    border-color:var(--ez-win-line);
    background:linear-gradient(to bottom right, var(--ez-win-a), var(--ez-win-b), var(--ez-win-c));
  }
  .pnl-day.win:hover{ box-shadow:0 10px 26px -8px var(--ez-win-glow), inset 0 1px 0 rgba(255,255,255,0.25); }
  .pnl-day.loss{
    border-color:rgba(251,113,133,0.35);
    background:linear-gradient(to bottom right, rgba(244,63,94,0.25), rgba(136,19,55,0.2), rgba(26,15,28,0.6));
  }
  .pnl-day.loss:hover{ box-shadow:0 10px 26px -8px rgba(251,75,107,0.55), inset 0 1px 0 rgba(255,255,255,0.2); }
  .pnl-day.today{ box-shadow:inset 0 0 0 2px rgba(var(--ez-focus-rgb),0.6); }
  .pnl-day.win.today:hover, .pnl-day.loss.today:hover{ box-shadow:inset 0 0 0 2px rgba(var(--ez-focus-rgb),0.6), 0 10px 26px -8px rgba(var(--ez-focus-rgb),0.7); }
  .pnl-day.flash{
    background:rgba(var(--ez-accent-rgb),0.45) !important; border-color:var(--ez-grad-b) !important;
    box-shadow:0 0 30px var(--ez-grad-glow) !important; transform:translateY(-2px) scale(0.98) !important;
    transition:background .1s, border-color .1s, box-shadow .1s, transform .1s;
  }
  .pnl-day-num{ color:var(--ez-btn-text); }
  .pnl-day-pnl{ margin-top:8px; font-family:var(--font-display); font-weight:600; font-size:14px; color:#a5f3fc; }
  .pnl-day-pnl.neg{ color:#fda4af; }
  .pnl-day-count{ font-size:11px; color:var(--muted); }
  .pnl-day-pnl .short{ display:none; }
  /* Narrow screens keep all seven days across (no sideways scrolling, so
     the weekday labels always sit over their own column); phones get
     compact cells with a short P&L. */
  @media (max-width:820px){
    .pnl-grid, .pnl-weekday-head{ grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; }
    .pnl-day{ min-height:72px; padding:7px 6px; }
    .pnl-day-pnl{ font-size:12.5px; white-space:nowrap; }
  }
  @media (max-width:560px){
    .pnl-body{ padding:10px 8px; }
    .pnl-grid, .pnl-weekday-head{ gap:4px; }
    .pnl-weekday-head span{ font-size:10.5px; }
    .pnl-day{ min-height:58px; padding:6px 2px; border-radius:9px; align-items:center; text-align:center; }
    .pnl-grid.week-view .pnl-day{ min-height:84px; }
    .pnl-day-num{ font-size:11px; }
    .pnl-day-pnl{ margin-top:5px; font-size:10.5px; letter-spacing:-0.02em; white-space:nowrap; }
    .pnl-day-pnl .full{ display:none; }
    .pnl-day-pnl .short{ display:inline; }
    .pnl-day-count{ display:none; }
  }
</style>
</head>
<body>
