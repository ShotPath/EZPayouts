<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EZPayouts Calendar</title>
<link rel="icon" type="image/png" href="../ezpayouts-icon-only.png">
<link rel="apple-touch-icon" href="../ezpayouts-icon-only.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --void:#07090a;
    --panel:#0c1310;
    --panel-raised:#121b16;
    --panel-hi:#182319;
    --hairline:#23332a;
    --hairline-bright:#345a44;
    --phosphor:#3ee08c;
    --phosphor-soft:#8fe6b6;
    --phosphor-dim:#1c5c3d;
    --phosphor-glow:rgba(62,224,140,0.35);
    --mint:#7ee8ac;
    --mint-text:#062b17;
    --red:#ef5a5a;
    --red-glow:rgba(239,90,90,0.35);
    --amber:#e8c34a;
    --amber-glow:rgba(232,195,74,0.35);
    --ice:#dcefe2;
    --muted:#7c9584;
    --muted-dim:#4d6055;
    --font-display:'Chakra Petch', 'Segoe UI', sans-serif;
    --font-body:'IBM Plex Sans', 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }

  *{box-sizing:border-box;}
  html{color-scheme:dark; height:100%;}
  body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(62,224,140,0.10), transparent 60%),
      radial-gradient(ellipse 80% 50% at 100% 100%, rgba(62,224,140,0.06), transparent 60%),
      var(--void);
    color:var(--ice);
    font-family:var(--font-body);
    padding-inline:clamp(10px,1.4vw,18px);
    padding-block:12px 12px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(62,224,140,0.035) 0px,
      rgba(62,224,140,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
    z-index:0;
    animation:scan 9s linear infinite;
  }
  @keyframes scan{
    0%{ background-position:0 0; }
    100%{ background-position:0 120px; }
  }
  @media (prefers-reduced-motion: reduce){
    body::before{ animation:none; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .wrap{
    width:100%; position:relative; z-index:1;
    flex:1; min-height:0; display:flex; flex-direction:column;
  }

  h1,h2{ font-family:var(--font-display); text-wrap:balance; margin:0; }
  a{ color:var(--phosphor-soft); }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  .cal-head{ flex:none; padding:10px 0 12px; }
  .cal-head h1{ font-size:25px; font-weight:700; color:var(--ice); letter-spacing:-0.01em; }

  .cal-toolbar{
    flex:none; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    margin-bottom:12px;
  }
  .cal-range{ font-family:var(--font-mono); font-size:13px; letter-spacing:0.04em; color:var(--muted); }
  .cal-legend{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .cal-legend-item{
    display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11.5px; color:var(--muted);
    white-space:nowrap; background:transparent; border:1px solid var(--hairline); border-radius:999px;
    padding:6px 13px 6px 11px; cursor:pointer; transition:border-color .15s, color .15s, background .15s, opacity .15s;
  }
  .cal-legend-item:hover{ border-color:var(--hairline-bright); color:var(--ice); }
  .cal-legend-item.active{ color:var(--ice); background:var(--panel-raised); border-color:var(--hairline-bright); }
  .cal-legend-item:not(.active){ opacity:0.45; }
  .cal-legend-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .cal-legend-dot.high{ background:var(--red); }
  .cal-legend-dot.medium{ background:var(--amber); }
  .cal-legend-dot.low{ background:var(--muted-dim); }

  .cal-filter{ display:flex; align-items:center; gap:8px; }
  .cal-filter span{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
  .cal-filter select{
    padding:8px 30px 8px 13px; border-radius:10px; border:1px solid var(--hairline-bright);
    background:var(--panel-raised) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path d="M1 3l4 4 4-4" fill="none" stroke="%237c9584" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 11px center;
    color:var(--ice); font-family:var(--font-mono); font-size:13px; font-weight:600; outline:none; cursor:pointer;
    appearance:none; transition:border-color .15s;
  }
  .cal-filter select:focus{ border-color:var(--phosphor-dim); }

  .cal-grid{
    flex:1; min-height:0; display:grid; grid-template-columns:repeat(7, 1fr); gap:12px;
  }
  .cal-day{
    min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden;
    background:var(--panel); border:1px solid var(--hairline-bright); border-radius:14px; padding:15px;
    box-shadow:0 14px 32px -22px var(--phosphor-glow);
  }
  .cal-day.today{ border-color:var(--phosphor); box-shadow:0 14px 32px -18px var(--phosphor-glow); }
  .cal-day-head{
    flex:none; display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--hairline);
  }
  .cal-day-name{ font-family:var(--font-mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
  .cal-day.today .cal-day-name{ color:var(--phosphor-soft); }
  .cal-day-num{ font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--ice); }
  .cal-day.today .cal-day-num{ color:var(--mint-text); background:var(--mint); padding:1px 10px; border-radius:999px; }

  .cal-day-events{
    flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
    margin-right:-6px; padding-right:6px;
    scrollbar-width:thin; scrollbar-color:var(--hairline-bright) transparent;
  }
  .cal-day-events::-webkit-scrollbar{ width:5px; }
  .cal-day-events::-webkit-scrollbar-track{ background:transparent; }
  .cal-day-events::-webkit-scrollbar-thumb{ background:var(--hairline-bright); border-radius:999px; }

  .cal-event{
    display:flex; align-items:flex-start; gap:9px; padding:9px 5px; margin:0 -5px; border-bottom:1px solid var(--hairline);
    width:100%; background:transparent; border-left:none; border-right:none; border-top:none; text-align:left;
    font:inherit; color:inherit; cursor:pointer; border-radius:6px; transition:background .12s;
  }
  .cal-event:hover, .cal-event:focus-visible{ background:var(--panel-hi); outline:none; }
  .cal-event:last-child{ border-bottom:none; }
  .cal-event-dot{ width:8px; height:8px; border-radius:50%; margin-top:5px; flex:none; }
  .cal-event-dot.high{ background:var(--red); box-shadow:0 0 6px 1px var(--red-glow); }
  .cal-event-dot.medium{ background:var(--amber); box-shadow:0 0 6px 1px var(--amber-glow); }
  .cal-event-dot.low{ background:var(--muted-dim); }
  .cal-event-title{ display:block; font-family:var(--font-display); font-weight:600; font-size:13.5px; color:var(--ice); line-height:1.35; }
  .cal-event-time{ display:block; font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:4px; }
  .cal-empty{ color:var(--muted-dim); font-size:12px; text-align:center; padding:18px 0; }

  /* ---------- Event detail modal ---------- */
  .cal-overlay{
    display:none; position:fixed; inset:0; z-index:700; background:rgba(4,7,6,0.72);
    align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(2px);
  }
  .cal-overlay.open{ display:flex; }
  .cal-modal{
    width:100%; max-width:420px; max-height:calc(100vh - 48px); overflow-y:auto;
    background:var(--panel-raised); border:1px solid var(--hairline-bright); border-radius:16px;
    padding:20px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), 0 0 30px -10px var(--phosphor-glow);
  }
  .cal-modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--hairline); margin-bottom:14px; }
  .cal-modal-title{ font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--ice); line-height:1.3; }
  .cal-modal-head-right{ display:flex; align-items:center; gap:10px; flex:none; }
  .cal-modal-impact{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--muted); white-space:nowrap; }
  .cal-modal-impact .cal-event-dot{ margin-top:0; }
  .cal-modal-impact.high{ color:var(--red); }
  .cal-modal-impact.medium{ color:var(--amber); }
  .cal-modal-close{
    width:28px; height:28px; border-radius:50%; flex:none; padding:0; cursor:pointer;
    background:var(--panel-hi); border:1px solid var(--hairline-bright); color:var(--muted);
    font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center;
    transition:border-color .15s, color .15s;
  }
  .cal-modal-close:hover{ border-color:var(--phosphor-dim); color:var(--ice); }
  .cal-modal-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:9px 0; border-bottom:1px solid var(--hairline); font-size:13px;
  }
  .cal-modal-row:last-of-type{ border-bottom:none; }
  .cal-modal-row-label{ color:var(--muted); }
  .cal-modal-row-value{ color:var(--ice); font-weight:600; text-align:right; }
  .cal-modal-about{ margin-top:14px; padding-top:14px; border-top:1px solid var(--hairline); }
  .cal-modal-about h3{ font-family:var(--font-display); font-weight:700; font-size:13.5px; color:var(--ice); margin:0 0 8px; }
  .cal-modal-about p{ margin:0; font-size:13px; color:var(--muted); line-height:1.6; }
  .cal-modal-foot{ display:flex; justify-content:flex-end; margin-top:18px; padding-top:14px; border-top:1px solid var(--hairline); }
  .cal-modal-close-btn{
    font-family:var(--font-display); font-weight:600; font-size:13px; padding:9px 20px;
    border-radius:10px; background:var(--panel-hi); border:1px solid var(--hairline-bright);
    color:var(--ice); cursor:pointer; transition:border-color .15s, background .15s;
  }
  .cal-modal-close-btn:hover{ border-color:var(--phosphor-dim); background:var(--mint); color:var(--mint-text); }

  @media (max-width:820px){
    .cal-grid{ grid-template-columns:repeat(7, minmax(130px,1fr)); overflow-x:auto; padding-bottom:4px; }
    .cal-day{ min-width:130px; }
  }
  @media (max-width:640px){
    .cal-head h1{ font-size:17px; }
  }

  /* ---------- View tabs (P&L Calendar / Economic Calendar) ---------- */
  .cal-view-tabs{
    flex:none; display:inline-flex; align-items:stretch; width:fit-content; margin-bottom:14px;
    border-radius:999px; border:1px solid var(--hairline-bright); background:var(--panel-raised);
  }
  .cal-view-tab{
    font-family:var(--font-mono); font-size:12px; font-weight:700; padding:9px 18px;
    background:transparent; border:none; border-radius:999px; color:var(--muted); cursor:pointer;
    white-space:nowrap; transition:color .15s, background .15s;
  }
  .cal-view-tab:hover{ color:var(--ice); }
  .cal-view-tab.active{ color:var(--mint-text); background:var(--mint); }

  .cal-view-panel{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .cal-view-panel[hidden]{ display:none; }

  /* ---------- P&L Calendar ---------- */
  .pnl-toolbar{
    flex:none; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    margin-bottom:12px;
  }
  .pnl-toolbar-left{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .pnl-mode-switch{
    display:inline-flex; align-items:stretch; border-radius:999px; border:1px solid var(--hairline-bright);
    background:var(--panel-raised);
  }
  .pnl-mode-switch button{
    font-family:var(--font-mono); font-size:11.5px; font-weight:700; padding:7px 14px;
    background:transparent; border:none; border-radius:999px; color:var(--muted); cursor:pointer; transition:color .15s, background .15s;
  }
  .pnl-mode-switch button.active{ color:var(--mint-text); background:var(--mint); }
  .pnl-nav{ display:flex; align-items:center; gap:4px; }
  .pnl-nav-btn{
    width:30px; height:30px; border-radius:9px; padding:0; cursor:pointer;
    background:var(--panel-raised); border:1px solid var(--hairline-bright); color:var(--ice);
    display:flex; align-items:center; justify-content:center; transition:border-color .15s, background .15s;
  }
  .pnl-nav-btn:hover{ border-color:var(--phosphor-dim); background:var(--panel-hi); }
  .pnl-nav-btn svg{ width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .pnl-period-label{ font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ice); min-width:150px; }
  .pnl-summary{ display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:12px; color:var(--muted); }
  .pnl-summary .pos{ color:var(--phosphor-soft); font-weight:700; }
  .pnl-summary .neg{ color:var(--red); font-weight:700; }

  .pnl-camera-wrap{ position:relative; }
  .pnl-camera-btn{
    width:36px; height:36px; border-radius:10px; padding:0; cursor:pointer;
    background:var(--panel-raised); border:1px solid var(--hairline-bright); color:var(--ice);
    display:flex; align-items:center; justify-content:center; transition:border-color .15s, background .15s;
  }
  .pnl-camera-btn:hover{ border-color:var(--phosphor-dim); background:var(--panel-hi); }
  .pnl-camera-btn svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .pnl-camera-menu{
    position:absolute; top:calc(100% + 8px); right:0; z-index:60; width:228px;
    background:var(--panel-raised); border:1px solid var(--hairline-bright); border-radius:14px;
    padding:6px; box-shadow:0 20px 44px -18px rgba(0,0,0,0.65);
  }
  .pnl-camera-menu[hidden]{ display:none; }
  .pnl-camera-menu button{
    width:100%; display:flex; align-items:center; gap:10px; text-align:left;
    background:transparent; border:none; border-radius:9px; padding:10px 11px; cursor:pointer;
    font-family:var(--font-body); font-size:13px; color:var(--ice); transition:background .12s;
  }
  .pnl-camera-menu button:hover{ background:var(--panel-hi); }
  .pnl-camera-menu button svg{ width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; color:var(--phosphor-soft); }
  .pnl-camera-menu .pnl-menu-sub{ display:block; font-family:var(--font-mono); font-size:10.5px; color:var(--muted); margin-top:2px; }
  .pnl-camera-toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(0); z-index:900;
    background:var(--panel-raised); border:1px solid var(--phosphor-dim); border-radius:12px;
    padding:11px 18px; font-family:var(--font-mono); font-size:12.5px; color:var(--phosphor-soft);
    box-shadow:0 20px 44px -18px rgba(0,0,0,0.7); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .pnl-camera-toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .pnl-grid{ flex:1; min-height:0; display:grid; grid-template-columns:repeat(7, 1fr); gap:10px; overflow-y:auto; align-content:start; }
  .pnl-grid.week-view{ grid-template-rows:1fr; overflow-y:hidden; }
  .pnl-weekday-head{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:10px; flex:none; margin-bottom:8px;
  }
  .pnl-weekday-head span{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted); text-align:center; padding-bottom:4px;
  }
  .pnl-day{
    min-width:0; min-height:86px; display:flex; flex-direction:column; justify-content:space-between;
    background:var(--panel); border:1px solid var(--hairline-bright); border-radius:14px; padding:11px 13px;
    box-shadow:0 10px 24px -20px var(--phosphor-glow);
  }
  .pnl-grid.week-view .pnl-day{ min-height:160px; }
  .pnl-day.outside{ opacity:0.32; }
  .pnl-day.today{ border-color:var(--phosphor); }
  .pnl-day.has-win{ border-color:var(--phosphor-dim); background:rgba(62,224,140,0.06); }
  .pnl-day.has-loss{ border-color:rgba(239,90,90,0.4); background:rgba(239,90,90,0.05); }
  .pnl-day-num{ font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--muted); }
  .pnl-day.today .pnl-day-num{ color:var(--mint-text); background:var(--mint); padding:0px 8px; border-radius:999px; align-self:flex-start; }
  .pnl-day-pnl{ font-family:var(--font-display); font-weight:700; font-size:16px; line-height:1.2; margin-top:4px; }
  .pnl-day-pnl.pos{ color:var(--phosphor-soft); }
  .pnl-day-pnl.neg{ color:var(--red); }
  .pnl-day-count{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); margin-top:2px; }
  @media (max-width:820px){
    .pnl-grid, .pnl-weekday-head{ grid-template-columns:repeat(7, minmax(96px,1fr)); overflow-x:auto; }
  }
</style>
</head>
<body>
<script src="/nav.js"></script>
<script src="/account.js"></script>
<script src="/coach.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<div class="wrap">

  <div class="cal-head">
    <h1>Calendar</h1>
  </div>

  <div class="cal-view-tabs" id="calViewTabs">
    <button type="button" class="cal-view-tab active" data-view="pnl">P&amp;L Calendar</button>
    <button type="button" class="cal-view-tab" data-view="econ">Economic Calendar</button>
  </div>

  <div class="cal-view-panel" id="pnlView">
    <div class="pnl-toolbar">
      <div class="pnl-toolbar-left">
        <div class="pnl-mode-switch" id="pnlModeSwitch">
          <button type="button" class="active" data-mode="month">Month</button>
          <button type="button" data-mode="week">Week</button>
        </div>
        <div class="pnl-nav">
          <button type="button" class="pnl-nav-btn" id="pnlPrevBtn" aria-label="Previous"><svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6"/></svg></button>
          <span class="pnl-period-label" id="pnlPeriodLabel">&nbsp;</span>
          <button type="button" class="pnl-nav-btn" id="pnlNextBtn" aria-label="Next"><svg viewBox="0 0 20 20"><path d="M8 4l6 6-6 6"/></svg></button>
        </div>
        <button type="button" class="ghost-btn" id="pnlTodayBtn" style="font-family:var(--font-mono);font-size:11.5px;font-weight:700;padding:7px 13px;border-radius:999px;border:1px solid var(--hairline-bright);background:var(--panel-raised);color:var(--ice);cursor:pointer;">Today</button>
        <span class="pnl-summary" id="pnlSummary"></span>
      </div>
      <div class="pnl-camera-wrap">
        <button type="button" class="pnl-camera-btn" id="pnlCameraBtn" aria-label="Snapshot options">
          <svg viewBox="0 0 20 20"><path d="M4 7h2.2l1-2h5.6l1 2H18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="10" cy="11.5" r="3"/></svg>
        </button>
        <div class="pnl-camera-menu" id="pnlCameraMenu" hidden>
          <button type="button" id="pnlCopyScreenshotBtn">
            <svg viewBox="0 0 20 20"><path d="M4 7h2.2l1-2h5.6l1 2H18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="10" cy="11.5" r="3"/></svg>
            <span>Copy Screenshot to Clipboard<span class="pnl-menu-sub">High-DPI PNG, copied instantly</span></span>
          </button>
          <button type="button" id="pnlOpenEditorBtn">
            <svg viewBox="0 0 20 20"><path d="M4 14.5 13 5.5l1.5 1.5L5.5 16H4v-1.5z"/><path d="M11.5 7 13 8.5"/></svg>
            <span>Open Card Editor<span class="pnl-menu-sub">Monthly share card, ready to customize</span></span>
          </button>
        </div>
      </div>
    </div>

    <div class="pnl-weekday-head" id="pnlWeekdayHead">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="pnl-grid" id="pnlGrid"></div>
  </div>
  <div class="pnl-camera-toast" id="pnlCameraToast"></div>

  <div class="cal-view-panel" id="econView" hidden>
    <div class="cal-toolbar">
      <span class="cal-range mono" id="calRange">Loading...</span>
      <div class="cal-legend" id="calLegend">
        <button type="button" class="cal-legend-item active" data-impact="high"><span class="cal-legend-dot high" aria-hidden="true"></span>High</button>
        <button type="button" class="cal-legend-item active" data-impact="medium"><span class="cal-legend-dot medium" aria-hidden="true"></span>Medium</button>
        <button type="button" class="cal-legend-item active" data-impact="low"><span class="cal-legend-dot low" aria-hidden="true"></span>Low</button>
      </div>
      <label class="cal-filter">
        <span>Filter</span>
        <select id="calCountry">
          <option value="">All Countries</option>
          <option value="USD" selected>USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="JPY">JPY</option>
          <option value="AUD">AUD</option>
          <option value="CAD">CAD</option>
          <option value="CHF">CHF</option>
          <option value="NZD">NZD</option>
          <option value="CNY">CNY</option>
        </select>
      </label>
    </div>

    <div class="cal-grid" id="calGrid">
      <p class="cal-empty">Loading calendar&hellip;</p>
    </div>
  </div>

  <div class="cal-overlay" id="calOverlay">
    <div class="cal-modal" id="calModal" role="dialog" aria-modal="true"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var FEED_URL = window.EZ_CALENDAR_BASE || "https://ezpayouts-calendar.ezpayouts.workers.dev";
  var gridEl = document.getElementById("calGrid");
  var rangeEl = document.getElementById("calRange");
  var countrySelect = document.getElementById("calCountry");
  var legendEl = document.getElementById("calLegend");
  var overlayEl = document.getElementById("calOverlay");
  var modalEl = document.getElementById("calModal");
  var DAY_NAMES = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  var allEvents = [];
  var renderedEvents = [];
  var loadFailed = false;
  var activeImpacts = { high: true, medium: true, low: true };

  // The feed has no description field, so match common indicator names to a
  // plain-English explanation. Order matters — more specific patterns (Core
  // CPI) are checked before their looser parents (CPI).
  var EVENT_DESCRIPTIONS = [
    [/core\s*pce/i, "The Fed's preferred inflation gauge, excluding volatile food and energy prices. A hotter-than-expected print tends to push back rate-cut expectations."],
    [/\bpce\b/i, "Personal Consumption Expenditures price index, a broad measure of inflation across the whole economy, tracking what households actually spent on."],
    [/core\s*cpi/i, "Consumer Price Index excluding food and energy, viewed as a cleaner read on underlying inflation trends than the headline number."],
    [/\bcpi\b/i, "Consumer Price Index, the most widely watched measure of inflation, tracking the change in prices paid by consumers for a basket of goods and services."],
    [/\bppi\b/i, "Producer Price Index, tracking inflation at the wholesale level before it reaches consumers. Often a leading signal for future CPI prints."],
    [/non\s*farm\s*payrolls|\bnfp\b/i, "The headline U.S. jobs report: net change in employment excluding the farming sector. One of the most market-moving releases of the month."],
    [/adp\s*non\s*farm\s*employment/i, "A private-sector estimate of monthly U.S. job creation, released ahead of the official government payrolls report and often used to gauge its likely direction."],
    [/unemployment\s*rate/i, "The percentage of the labor force that is jobless and actively looking for work."],
    [/initial\s*jobless\s*claims|unemployment\s*claims/i, "The number of people filing for unemployment benefits for the first time in the past week, a timely read on labor market health."],
    [/\bgdp\b/i, "Gross Domestic Product, the total value of goods and services produced within the country, adjusted to an annual rate. A vital indicator used to evaluate economic performance."],
    [/retail\s*sales/i, "The change in total value of sales at the retail level, a key gauge of consumer spending strength."],
    [/(manufacturing|services|composite)?\s*pmi/i, "Purchasing Managers' Index, a survey-based gauge of business activity. Above 50 signals expansion, below 50 signals contraction."],
    [/ism\s*manufacturing|ism\s*non-?manufacturing|ism\s*services/i, "An ISM survey of purchasing managers gauging business conditions in that sector. Above 50 signals expansion, below 50 signals contraction."],
    [/interest\s*rate\s*decision|rate\s*decision/i, "The central bank's official benchmark interest rate announcement, one of the highest-impact releases on the calendar."],
    [/fomc\s*statement|monetary\s*policy\s*statement/i, "The central bank's official policy statement accompanying a rate decision, scrutinized line by line for shifts in forward guidance."],
    [/press\s*conference/i, "A central bank official's live press conference following a policy decision, often more market-moving than the decision itself as reporters press for detail."],
    [/\bspeaks\b|testifies|testimony/i, "A scheduled public appearance by a central bank or government official. Off-the-cuff remarks on policy or the economy can move markets in real time."],
    [/crude\s*oil\s*inventories/i, "The weekly change in U.S. commercial crude oil stockpiles, closely watched by oil traders as a supply/demand signal."],
    [/natural\s*gas\s*storage/i, "The weekly change in U.S. natural gas inventories, a key input for natural gas price moves."],
    [/building\s*permits/i, "The number of new building permits issued, a forward-looking indicator of construction activity."],
    [/housing\s*starts/i, "The number of new residential construction projects started during the period, a gauge of housing market momentum."],
    [/existing\s*home\s*sales/i, "The annualized number of previously owned homes sold during the period, the bulk of the U.S. housing market."],
    [/new\s*home\s*sales/i, "The annualized number of newly constructed homes sold during the period."],
    [/consumer\s*confidence/i, "A survey-based gauge of how optimistic consumers feel about the economy and their own finances, which feeds into future spending."],
    [/michigan\s*consumer\s*sentiment/i, "The University of Michigan's survey of consumer attitudes toward current conditions and expectations, a widely followed sentiment gauge."],
    [/durable\s*goods\s*orders/i, "The change in new orders placed with manufacturers for goods meant to last three years or more, a read on business investment demand."],
    [/industrial\s*production/i, "The change in output produced by manufacturers, mines, and utilities, a core measure of the economy's productive activity."],
    [/trade\s*balance/i, "The difference between a country's exports and imports of goods and services over the period."],
    [/current\s*account/i, "A broad measure of a country's transactions with the rest of the world, including trade, income, and transfers."],
    [/employment\s*change/i, "The net change in the number of employed people during the period, a core labor market indicator for that economy."],
    [/minutes/i, "The detailed record of a recent central bank policy meeting, released with a lag and scoured for clues on the path of future rate decisions."],
  ];

  function describeEvent(ev){
    for (var i = 0; i < EVENT_DESCRIPTIONS.length; i++){
      if (EVENT_DESCRIPTIONS[i][0].test(ev.title)) return EVENT_DESCRIPTIONS[i][1];
    }
    return "Scheduled economic data release for " + escapeHtml(ev.country) + ". Check the forecast and previous figures above, and watch for a market reaction around the release time.";
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function impactClass(impact){
    var i = (impact || "").toLowerCase();
    if (i === "high") return "high";
    if (i === "medium") return "medium";
    return "low";
  }

  function fmtTime(d){
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function currentWeek(){
    var today = new Date();
    var start = new Date(today);
    start.setHours(0, 0, 0, 0);
    start.setDate(start.getDate() - start.getDay());
    var days = [];
    for (var i = 0; i < 7; i++){
      var d = new Date(start);
      d.setDate(d.getDate() + i);
      days.push(d);
    }
    return { today: today, days: days };
  }

  function visibleEvents(){
    var country = countrySelect.value;
    return allEvents.filter(function(e){
      if (country && e.country !== country) return false;
      return activeImpacts[impactClass(e.impact)];
    });
  }

  function render(){
    if (loadFailed) return;
    var week = currentWeek();
    var start = week.days[0];
    var end = week.days[6];
    rangeEl.textContent = start.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
      " – " + end.toLocaleDateString(undefined, { month: "short", day: "numeric" });

    var filtered = visibleEvents();
    var byDate = {};
    filtered.forEach(function(e){
      var key = e.dateObj.toDateString();
      (byDate[key] = byDate[key] || []).push(e);
    });

    renderedEvents = [];

    gridEl.innerHTML = week.days.map(function(d){
      var key = d.toDateString();
      var events = (byDate[key] || []).sort(function(a, b){ return a.dateObj - b.dateObj; });
      var isToday = key === week.today.toDateString();
      var body = events.length
        ? events.map(function(e){
            var idx = renderedEvents.push(e) - 1;
            return '<button type="button" class="cal-event" data-idx="' + idx + '">' +
              '<span class="cal-event-dot ' + impactClass(e.impact) + '" aria-hidden="true"></span>' +
              '<span><span class="cal-event-title">' + escapeHtml(e.title) + '</span>' +
              '<span class="cal-event-time">' + fmtTime(e.dateObj) + ' &middot; ' + escapeHtml(e.country) + '</span></span>' +
            '</button>';
          }).join("")
        : '<p class="cal-empty">No events</p>';
      return '<div class="cal-day' + (isToday ? ' today' : '') + '">' +
        '<div class="cal-day-head"><span class="cal-day-name">' + DAY_NAMES[d.getDay()] + '</span><span class="cal-day-num">' + d.getDate() + '</span></div>' +
        '<div class="cal-day-events">' + body + '</div>' +
      "</div>";
    }).join("");
  }

  function openEventModal(ev){
    var impactCls = impactClass(ev.impact);
    var impactLabel = impactCls.charAt(0).toUpperCase() + impactCls.slice(1);
    var rows = [
      ["Date", ev.dateObj.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })],
      ["Time", fmtTime(ev.dateObj)],
      ["Country", ev.country],
    ];
    if (ev.forecast) rows.push(["Forecast", ev.forecast]);
    if (ev.previous) rows.push(["Previous", ev.previous]);

    modalEl.innerHTML =
      '<div class="cal-modal-head">' +
        '<span class="cal-modal-title">' + escapeHtml(ev.title) + '</span>' +
        '<span class="cal-modal-head-right">' +
          '<span class="cal-modal-impact ' + impactCls + '"><span class="cal-event-dot ' + impactCls + '" aria-hidden="true"></span>' + impactLabel + '</span>' +
          '<button type="button" class="cal-modal-close" id="calModalX" aria-label="Close">&times;</button>' +
        '</span>' +
      '</div>' +
      rows.map(function(r){
        return '<div class="cal-modal-row"><span class="cal-modal-row-label">' + r[0] + '</span><span class="cal-modal-row-value">' + escapeHtml(r[1]) + '</span></div>';
      }).join("") +
      '<div class="cal-modal-about"><h3>About this event</h3><p>' + describeEvent(ev) + '</p></div>' +
      '<div class="cal-modal-foot"><button type="button" class="cal-modal-close-btn" id="calModalClose">Close</button></div>';

    overlayEl.classList.add("open");
    document.getElementById("calModalX").addEventListener("click", closeEventModal);
    document.getElementById("calModalClose").addEventListener("click", closeEventModal);
  }

  function closeEventModal(){
    overlayEl.classList.remove("open");
  }

  var overlayMouseDownOnBackdrop = false;
  overlayEl.addEventListener("mousedown", function(e){ overlayMouseDownOnBackdrop = e.target === overlayEl; });
  overlayEl.addEventListener("click", function(e){
    if (e.target === overlayEl && overlayMouseDownOnBackdrop) closeEventModal();
    overlayMouseDownOnBackdrop = false;
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && overlayEl.classList.contains("open")) closeEventModal();
  });

  gridEl.addEventListener("click", function(e){
    var btn = e.target.closest(".cal-event");
    if (!btn) return;
    var idx = parseInt(btn.getAttribute("data-idx"), 10);
    var ev = renderedEvents[idx];
    if (ev) openEventModal(ev);
  });

  countrySelect.addEventListener("change", render);

  legendEl.addEventListener("click", function(e){
    var btn = e.target.closest(".cal-legend-item");
    if (!btn) return;
    var impact = btn.getAttribute("data-impact");
    activeImpacts[impact] = !activeImpacts[impact];
    btn.classList.toggle("active", activeImpacts[impact]);
    render();
  });

  fetch(FEED_URL)
    .then(function(res){ return res.json(); })
    .then(function(data){
      allEvents = (Array.isArray(data) ? data : []).map(function(e){
        return {
          title: e.title,
          country: e.country,
          impact: e.impact,
          forecast: e.forecast || "",
          previous: e.previous || "",
          dateObj: new Date(e.date),
        };
      }).filter(function(e){ return e.title && e.dateObj && !isNaN(e.dateObj.getTime()); });
      render();
    })
    .catch(function(){
      loadFailed = true;
      rangeEl.textContent = "";
      gridEl.innerHTML = '<p class="cal-empty">Couldn’t load the calendar right now &mdash; try again shortly.</p>';
    });

  // Lets the shared coach widget (coach.js) answer questions about the
  // events actually visible on screen right now, respecting the filters.
  window.EZEconPageContext = function(){
    var events = visibleEvents().slice(0, 60).map(function(e){
      return { title: e.title, country: e.country, impact: e.impact, time: e.dateObj.toISOString() };
    });
    return {
      pageName: "Economic Calendar",
      data: {
        countryFilter: countrySelect.value || "All countries",
        impactFilter: Object.keys(activeImpacts).filter(function(k){ return activeImpacts[k]; }).join(", ") || "none",
        events: events
      }
    };
  };
})();
</script>

<script>
(function(){
  "use strict";

  // ---------- Tab switching between P&L Calendar and Economic Calendar ----------
  var tabsEl = document.getElementById("calViewTabs");
  var pnlViewEl = document.getElementById("pnlView");
  var econViewEl = document.getElementById("econView");
  var cameraToastEl = document.getElementById("pnlCameraToast");
  var activeView = "pnl";

  tabsEl.addEventListener("click", function(e){
    var btn = e.target.closest(".cal-view-tab");
    if (!btn) return;
    var view = btn.getAttribute("data-view");
    if (view === activeView) return;
    activeView = view;
    tabsEl.querySelectorAll(".cal-view-tab").forEach(function(b){ b.classList.toggle("active", b === btn); });
    pnlViewEl.hidden = view !== "pnl";
    econViewEl.hidden = view !== "econ";
  });

  // ---------- Read-only journal data (same storage shape as Journal/Dashboard) ----------
  var JOURNAL_STORAGE_KEY = "ezpayouts.journal.v1";
  var journalAccounts = [];

  function migrateJournalData(parsed){
    if (parsed && Array.isArray(parsed.accounts) && parsed.accounts.length) return parsed.accounts;
    if (parsed && Array.isArray(parsed.trades)) return [{ id: "acc_default", name: "Main", trades: parsed.trades }];
    return null;
  }
  function loadJournal(){
    try {
      var raw = localStorage.getItem(JOURNAL_STORAGE_KEY);
      var migrated = raw ? migrateJournalData(JSON.parse(raw)) : null;
      if (migrated) journalAccounts = migrated;
    } catch (err) {}
  }
  function allTrades(){
    var out = [];
    journalAccounts.forEach(function(acc){ (acc.trades || []).forEach(function(t){ out.push(t); }); });
    return out;
  }
  function pnlByDate(){
    var map = {};
    allTrades().forEach(function(t){
      if (!t.date) return;
      if (!map[t.date]) map[t.date] = { pnl: 0, count: 0 };
      map[t.date].pnl += (Number(t.pnl) || 0);
      map[t.date].count += 1;
    });
    return map;
  }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtMoneySigned(n){
    n = Number(n) || 0;
    return (n < 0 ? "-$" : "+$") + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
  }
  function dateKey(d){
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // ---------- P&L Calendar state ----------
  var pnlMode = "month"; // "month" | "week"
  var pnlCursor = new Date(); // anchor date within the displayed month/week
  pnlCursor.setHours(0, 0, 0, 0);

  var pnlModeSwitchEl = document.getElementById("pnlModeSwitch");
  var pnlPrevBtn = document.getElementById("pnlPrevBtn");
  var pnlNextBtn = document.getElementById("pnlNextBtn");
  var pnlTodayBtn = document.getElementById("pnlTodayBtn");
  var pnlPeriodLabelEl = document.getElementById("pnlPeriodLabel");
  var pnlSummaryEl = document.getElementById("pnlSummary");
  var pnlGridEl = document.getElementById("pnlGrid");
  var pnlWeekdayHeadEl = document.getElementById("pnlWeekdayHead");
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function monthDaysGrid(anchor){
    var year = anchor.getFullYear(), month = anchor.getMonth();
    var firstOfMonth = new Date(year, month, 1);
    var startOffset = firstOfMonth.getDay(); // 0=Sun
    var gridStart = new Date(year, month, 1 - startOffset);
    var days = [];
    for (var i = 0; i < 42; i++){
      var d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      days.push(d);
    }
    // Trim trailing all-outside-month rows beyond 5 full weeks when unneeded.
    while (days.length > 35 && days[days.length - 7].getMonth() !== month) days.splice(days.length - 7, 7);
    return days;
  }
  function weekDaysGrid(anchor){
    var d = new Date(anchor);
    var start = new Date(d);
    start.setDate(d.getDate() - d.getDay());
    var days = [];
    for (var i = 0; i < 7; i++){
      var dd = new Date(start);
      dd.setDate(start.getDate() + i);
      days.push(dd);
    }
    return days;
  }

  function renderPnlCalendar(){
    var byDate = pnlByDate();
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var days = pnlMode === "month" ? monthDaysGrid(pnlCursor) : weekDaysGrid(pnlCursor);
    var refMonth = pnlCursor.getMonth();

    pnlGridEl.classList.toggle("week-view", pnlMode === "week");
    pnlWeekdayHeadEl.style.display = "";

    var periodPnl = 0, periodTrades = 0;

    pnlGridEl.innerHTML = days.map(function(d){
      var key = dateKey(d);
      var data = byDate[key];
      var isOutside = pnlMode === "month" && d.getMonth() !== refMonth;
      var isToday = dateKey(d) === dateKey(today);
      if (!isOutside && data){ periodPnl += data.pnl; periodTrades += data.count; }
      var cls = ["pnl-day"];
      if (isOutside) cls.push("outside");
      if (isToday) cls.push("today");
      if (!isOutside && data){ cls.push(data.pnl >= 0 ? "has-win" : "has-loss"); }
      var body = "";
      if (data){
        body = '<div class="pnl-day-pnl ' + (data.pnl >= 0 ? "pos" : "neg") + '">' + fmtMoneySigned(data.pnl) + '</div>' +
          '<div class="pnl-day-count">' + data.count + " trade" + (data.count === 1 ? "" : "s") + '</div>';
      }
      return '<div class="' + cls.join(" ") + '" data-date="' + key + '">' +
        '<span class="pnl-day-num">' + d.getDate() + '</span>' +
        body +
      '</div>';
    }).join("");

    if (pnlMode === "month"){
      pnlPeriodLabelEl.textContent = MONTH_NAMES[pnlCursor.getMonth()] + " " + pnlCursor.getFullYear();
    } else {
      var wd = weekDaysGrid(pnlCursor);
      var s = wd[0], e = wd[6];
      var sameMonth = s.getMonth() === e.getMonth();
      var MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      var startStr = MONTH_ABBR[s.getMonth()] + " " + s.getDate();
      var endStr = (sameMonth ? "" : MONTH_ABBR[e.getMonth()] + " ") + e.getDate() + ", " + e.getFullYear();
      pnlPeriodLabelEl.textContent = startStr + " – " + endStr;
    }

    pnlSummaryEl.innerHTML = periodTrades
      ? '<span class="' + (periodPnl >= 0 ? "pos" : "neg") + '">' + fmtMoneySigned(periodPnl) + '</span> &middot; ' + periodTrades + " trade" + (periodTrades === 1 ? "" : "s")
      : "No trades this " + (pnlMode === "month" ? "month" : "week");
  }

  pnlModeSwitchEl.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    var mode = btn.getAttribute("data-mode");
    if (mode === pnlMode) return;
    pnlMode = mode;
    pnlModeSwitchEl.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active", b === btn); });
    renderPnlCalendar();
  });
  pnlPrevBtn.addEventListener("click", function(){
    if (pnlMode === "month") pnlCursor.setMonth(pnlCursor.getMonth() - 1);
    else pnlCursor.setDate(pnlCursor.getDate() - 7);
    renderPnlCalendar();
  });
  pnlNextBtn.addEventListener("click", function(){
    if (pnlMode === "month") pnlCursor.setMonth(pnlCursor.getMonth() + 1);
    else pnlCursor.setDate(pnlCursor.getDate() + 7);
    renderPnlCalendar();
  });
  pnlTodayBtn.addEventListener("click", function(){
    pnlCursor = new Date();
    pnlCursor.setHours(0, 0, 0, 0);
    renderPnlCalendar();
  });

  window.addEventListener("storage", function(e){
    if (e.key === JOURNAL_STORAGE_KEY){ loadJournal(); renderPnlCalendar(); }
  });
  window.addEventListener("focus", function(){ loadJournal(); renderPnlCalendar(); });

  // ---------- Camera menu: Copy Screenshot to Clipboard / Open Card Editor ----------
  var pnlCameraBtn = document.getElementById("pnlCameraBtn");
  var pnlCameraMenu = document.getElementById("pnlCameraMenu");
  var pnlCopyScreenshotBtn = document.getElementById("pnlCopyScreenshotBtn");
  var pnlOpenEditorBtn = document.getElementById("pnlOpenEditorBtn");

  function closeCameraMenu(){ pnlCameraMenu.hidden = true; }
  pnlCameraBtn.addEventListener("click", function(e){
    e.stopPropagation();
    pnlCameraMenu.hidden = !pnlCameraMenu.hidden;
  });
  document.addEventListener("click", function(e){
    if (!pnlCameraMenu.hidden && !pnlCameraMenu.contains(e.target) && e.target !== pnlCameraBtn) closeCameraMenu();
  });

  function showToast(msg){
    cameraToastEl.textContent = msg;
    cameraToastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ cameraToastEl.classList.remove("show"); }, 2600);
  }

  pnlCopyScreenshotBtn.addEventListener("click", function(){
    closeCameraMenu();
    if (typeof html2canvas !== "function"){
      showToast("Screenshot tool failed to load — try again shortly.");
      return;
    }
    html2canvas(pnlViewEl, { scale: 2, backgroundColor: "#07090a" }).then(function(canvas){
      canvas.toBlob(function(blob){
        if (!blob){ showToast("Couldn't generate the image."); return; }
        if (navigator.clipboard && window.ClipboardItem){
          navigator.clipboard.write([ new ClipboardItem({ "image/png": blob }) ])
            .then(function(){ showToast("Calendar snapshot copied to clipboard!"); })
            .catch(function(){
              var a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = "ezpayouts-calendar.png";
              a.click();
              showToast("Clipboard unavailable — downloaded instead.");
            });
        } else {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "ezpayouts-calendar.png";
          a.click();
          showToast("Clipboard unavailable — downloaded instead.");
        }
      }, "image/png");
    }).catch(function(){
      showToast("Couldn't capture the calendar. Try again.");
    });
  });

  pnlOpenEditorBtn.addEventListener("click", function(){
    closeCameraMenu();
    var anchor = pnlMode === "month"
      ? new Date(pnlCursor.getFullYear(), pnlCursor.getMonth(), 1)
      : weekDaysGrid(pnlCursor)[0];
    var dateParam = dateKey(anchor);
    window.location.href = "/journal/?share=monthly&date=" + encodeURIComponent(dateParam);
  });

  // Lets the shared coach widget answer questions about whichever calendar
  // view is currently on screen.
  window.EZPageContext = function(){
    if (activeView === "econ" && typeof window.EZEconPageContext === "function") return window.EZEconPageContext();
    var byDate = pnlByDate();
    var days = pnlMode === "month" ? monthDaysGrid(pnlCursor) : weekDaysGrid(pnlCursor);
    var daysData = days.filter(function(d){
      return pnlMode === "week" || d.getMonth() === pnlCursor.getMonth();
    }).map(function(d){
      var key = dateKey(d);
      var data = byDate[key];
      return { date: key, pnl: data ? data.pnl : 0, trades: data ? data.count : 0 };
    });
    return {
      pageName: "P&L Calendar",
      data: { mode: pnlMode, period: pnlPeriodLabelEl.textContent, days: daysData }
    };
  };

  loadJournal();
  renderPnlCalendar();
})();
</script>
</body>
