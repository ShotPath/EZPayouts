<script>
(function(){
  "use strict";

  var FEED_URL = window.EZ_CALENDAR_BASE || "https://ezpayouts-calendar.ezpayouts.workers.dev";
  var gridEl = document.getElementById("calGrid");
  var nextEl = document.getElementById("econNext");
  var weekEl = document.getElementById("econWeek");
  var daysEl = document.getElementById("econDays");
  var tzEl = document.getElementById("econTz");
  var countrySelect = document.getElementById("calCountry");
  var legendEl = document.getElementById("calLegend");
  var overlayEl = document.getElementById("calOverlay");
  var modalEl = document.getElementById("calModal");
  var DAY_NAMES = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  var DAY_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var CCY_COLORS = { USD: "#5b8cff", EUR: "#f2c94c", GBP: "#c084fc", JPY: "#f87171", AUD: "#34d399",
    CAD: "#fb923c", CHF: "#f472b6", NZD: "#2dd4bf", CNY: "#ef4444" };
  var CHEVRON = '<span class="econ-chev" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5"/></svg></span>';
  var allEvents = [];
  var renderedEvents = [];
  var loadState = "loading";
  var activeImpacts = { high: true, medium: true, low: true };
  var scrolledToNow = false;

  // The feed has no description field, so match common indicator names to a
  // plain-English explanation. Order matters — more specific patterns (Core
  // CPI) are checked before their looser parents (CPI).
  var EVENT_DESCRIPTIONS = [
    [/core\s*pce/i, "The Fed's preferred inflation gauge, excluding volatile food and energy prices. A hotter-than-expected print tends to push back rate-cut expectations."],
    [/\bpce\b/i, "Personal Consumption Expenditures price index, a broad measure of inflation across the whole economy, tracking what households actually spent on."],
    [/core\s*cpi/i, "Consumer Price Index excluding food and energy, viewed as a cleaner read on underlying inflation trends than the headline number."],
    [/\bcpi\b/i, "Consumer Price Index, the most widely watched measure of inflation, tracking the change in prices paid by consumers for a basket of goods and services."],
    [/\bppi\b/i, "Producer Price Index, tracking inflation at the wholesale level before it reaches consumers. Often a leading signal for future CPI prints."],
    [/non\s*farm\s*payrolls|\bnfp\b/i, "The headline U.S. jobs report: net change in employment excluding the farming sector. One of the most market-moving releases of the month."],
    [/adp\s*non\s*farm\s*employment/i, "A private-sector estimate of monthly U.S. job creation, released ahead of the official government payrolls report and often used to gauge its likely direction."],
    [/unemployment\s*rate/i, "The percentage of the labor force that is jobless and actively looking for work."],
    [/initial\s*jobless\s*claims|unemployment\s*claims/i, "The number of people filing for unemployment benefits for the first time in the past week, a timely read on labor market health."],
    [/\bgdp\b/i, "Gross Domestic Product, the total value of goods and services produced within the country, adjusted to an annual rate. A vital indicator used to evaluate economic performance."],
    [/retail\s*sales/i, "The change in total value of sales at the retail level, a key gauge of consumer spending strength."],
    [/(manufacturing|services|composite)?\s*pmi/i, "Purchasing Managers' Index, a survey-based gauge of business activity. Above 50 signals expansion, below 50 signals contraction."],
    [/ism\s*manufacturing|ism\s*non-?manufacturing|ism\s*services/i, "An ISM survey of purchasing managers gauging business conditions in that sector. Above 50 signals expansion, below 50 signals contraction."],
    [/interest\s*rate\s*decision|rate\s*decision/i, "The central bank's official benchmark interest rate announcement, one of the highest-impact releases on the calendar."],
    [/fomc\s*statement|monetary\s*policy\s*statement/i, "The central bank's official policy statement accompanying a rate decision, scrutinized line by line for shifts in forward guidance."],
    [/press\s*conference/i, "A central bank official's live press conference following a policy decision, often more market-moving than the decision itself as reporters press for detail."],
    [/\bspeaks\b|testifies|testimony/i, "A scheduled public appearance by a central bank or government official. Off-the-cuff remarks on policy or the economy can move markets in real time."],
    [/crude\s*oil\s*inventories/i, "The weekly change in U.S. commercial crude oil stockpiles, closely watched by oil traders as a supply/demand signal."],
    [/natural\s*gas\s*storage/i, "The weekly change in U.S. natural gas inventories, a key input for natural gas price moves."],
    [/building\s*permits/i, "The number of new building permits issued, a forward-looking indicator of construction activity."],
    [/housing\s*starts/i, "The number of new residential construction projects started during the period, a gauge of housing market momentum."],
    [/existing\s*home\s*sales/i, "The annualized number of previously owned homes sold during the period, the bulk of the U.S. housing market."],
    [/new\s*home\s*sales/i, "The annualized number of newly constructed homes sold during the period."],
    [/consumer\s*confidence/i, "A survey-based gauge of how optimistic consumers feel about the economy and their own finances, which feeds into future spending."],
    [/michigan\s*consumer\s*sentiment/i, "The University of Michigan's survey of consumer attitudes toward current conditions and expectations, a widely followed sentiment gauge."],
    [/durable\s*goods\s*orders/i, "The change in new orders placed with manufacturers for goods meant to last three years or more, a read on business investment demand."],
    [/industrial\s*production/i, "The change in output produced by manufacturers, mines, and utilities, a core measure of the economy's productive activity."],
    [/trade\s*balance/i, "The difference between a country's exports and imports of goods and services over the period."],
    [/current\s*account/i, "A broad measure of a country's transactions with the rest of the world, including trade, income, and transfers."],
    [/employment\s*change/i, "The net change in the number of employed people during the period, a core labor market indicator for that economy."],
    [/minutes/i, "The detailed record of a recent central bank policy meeting, released with a lag and scoured for clues on the path of future rate decisions."],
  ];

  function describeEvent(ev){
    for (var i = 0; i < EVENT_DESCRIPTIONS.length; i++){
      if (EVENT_DESCRIPTIONS[i][0].test(ev.title)) return EVENT_DESCRIPTIONS[i][1];
    }
    return "Scheduled economic data release for " + escapeHtml(ev.country) + ". Check the forecast and previous figures above, and watch for a market reaction around the release time.";
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function impactClass(impact){
    var i = (impact || "").toLowerCase();
    if (i === "high") return "high";
    if (i === "medium") return "medium";
    if (i === "holiday") return "holiday";
    return "low";
  }
  // Holidays are shown with the low-impact releases.
  function impactFilterKey(ev){ var c = impactClass(ev.impact); return c === "holiday" ? "low" : c; }
  function impactLabel(c){ return c === "holiday" ? "Holiday" : c.charAt(0).toUpperCase() + c.slice(1); }
  function impactBars(c){ return '<span class="econ-impact ' + c + '" aria-hidden="true"><i></i><i></i><i></i></span>'; }
  function ccyChip(code){
    return '<span class="econ-ccy" style="--ccy:' + (CCY_COLORS[code] || "var(--muted)") + '">' + escapeHtml(code || "—") + '</span>';
  }

  function fmtTime(d){
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function eventTime(ev){ return impactClass(ev.impact) === "holiday" ? "All day" : fmtTime(ev.dateObj); }
  function fmtDayShort(d){ return DAY_NAMES[d.getDay()].charAt(0) + DAY_NAMES[d.getDay()].slice(1).toLowerCase() + " " + d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
  function fmtCountdown(ms){
    var s = Math.max(0, Math.floor(ms / 1000));
    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    function p(n){ return String(n).padStart(2, "0"); }
    if (d > 0) return d + "d " + p(h) + "h " + p(m) + "m";
    return p(h) + ":" + p(m) + ":" + p(sec);
  }

  function currentWeek(){
    var today = new Date();
    var start = new Date(today);
    start.setHours(0, 0, 0, 0);
    start.setDate(start.getDate() - start.getDay());
    var days = [];
    for (var i = 0; i < 7; i++){
      var d = new Date(start);
      d.setDate(d.getDate() + i);
      days.push(d);
    }
    return { today: today, days: days };
  }

  function countryEvents(){
    var country = countrySelect.value;
    return allEvents.filter(function(e){ return !country || e.country === country; });
  }
  function visibleEvents(){
    return countryEvents().filter(function(e){ return activeImpacts[impactFilterKey(e)]; });
  }
  // An event counts as done a few minutes after its release time.
  function isPast(ev, now){ return ev.dateObj.getTime() + 2 * 60000 < now; }

  // ---------- Up next + the week at a glance ----------
  function renderNext(){
    var now = Date.now();
    var list = visibleEvents().filter(function(e){ return impactClass(e.impact) !== "holiday"; })
      .sort(function(a, b){ return a.dateObj - b.dateObj; });
    var upcoming = list.filter(function(e){ return !isPast(e, now); });
    var ev = upcoming[0];
    if (!ev){
      nextEl.className = "econ-card econ-next";
      nextEl.innerHTML = '<div class="econ-eyebrow">Up next</div><div class="econ-next-empty">' +
        (list.length ? "That&rsquo;s everything for this week. New releases show up when next week&rsquo;s calendar is published."
                     : "Nothing scheduled for these filters this week.") + "</div>";
      return;
    }
    var c = impactClass(ev.impact);
    var idx = renderedEvents.indexOf(ev);
    nextEl.className = "econ-card econ-next" + (c === "high" ? " is-high" : "");
    var released = ev.dateObj.getTime() <= now;
    nextEl.innerHTML =
      '<div class="econ-eyebrow">Up next ' + impactBars(c) + '<span class="econ-impact-label ' + c + '">' + impactLabel(c) + ' impact</span></div>' +
      '<div class="econ-next-main">' +
        '<div style="min-width:0">' +
          '<div class="econ-next-title">' + escapeHtml(ev.title) + '</div>' +
          '<div class="econ-next-when">' + ccyChip(ev.country) + '<span>' + fmtDayShort(ev.dateObj) + ' &middot; ' + fmtTime(ev.dateObj) + '</span></div>' +
        '</div>' +
        '<div class="econ-countdown"><div class="econ-countdown-value" id="econCountdown" data-at="' + ev.dateObj.getTime() + '">' +
          (released ? "Now" : fmtCountdown(ev.dateObj.getTime() - now)) + '</div>' +
          '<div class="econ-countdown-label">' + (released ? "Releasing" : "Until release") + '</div></div>' +
      '</div>' +
      '<p class="econ-next-about">' + describeEvent(ev) + '</p>' +
      ((ev.forecast || ev.previous) ? '<div class="econ-next-stats">' +
        (ev.forecast ? '<span>Forecast<strong>' + escapeHtml(ev.forecast) + '</strong></span>' : "") +
        (ev.previous ? '<span>Previous<strong>' + escapeHtml(ev.previous) + '</strong></span>' : "") +
      '</div>' : "");
    nextEl.style.cursor = idx >= 0 ? "pointer" : "";
    nextEl.onclick = idx >= 0 ? function(){ openEventModal(ev); } : null;
  }
  function tickCountdown(){
    var el = document.getElementById("econCountdown");
    if (!el) return;
    var left = Number(el.getAttribute("data-at")) - Date.now();
    if (left <= 0){ renderAll(); return; }
    el.textContent = fmtCountdown(left);
  }

  function renderWeek(list){
    var now = Date.now();
    var counts = { high: 0, medium: 0, low: 0 };
    list.forEach(function(e){ counts[impactFilterKey(e)]++; });
    var keys = list.filter(function(e){ return impactClass(e.impact) === "high"; })
      .sort(function(a, b){ return a.dateObj - b.dateObj; }).slice(0, 4);
    weekEl.innerHTML =
      '<div class="econ-eyebrow">This week</div>' +
      '<div class="econ-week-counts">' + ["high", "medium", "low"].map(function(k){
        return '<div class="econ-count"><div class="econ-count-value">' + counts[k] + '</div>' +
          '<div class="econ-count-label">' + impactBars(k) + impactLabel(k) + '</div></div>';
      }).join("") + '</div>' +
      '<div class="econ-key-list">' + (keys.length ? keys.map(function(e){
        var idx = renderedEvents.indexOf(e);
        return '<button type="button" class="econ-key' + (isPast(e, now) ? " past" : "") + '" data-idx="' + idx + '">' +
          '<span class="econ-key-when">' + fmtDayShort(e.dateObj).slice(0, 3) + ' ' + fmtTime(e.dateObj) + '</span>' +
          ccyChip(e.country) + '<span class="econ-key-title">' + escapeHtml(e.title) + '</span></button>';
      }).join("") : '<div class="econ-day-empty" style="padding:6px 8px">No high-impact releases this week.</div>') + '</div>';
  }

  // ---------- Day strip + agenda ----------
  function renderAll(){
    if (loadState !== "ready") return;
    var week = currentWeek(), now = Date.now();
    var todayKey = week.today.toDateString();
    var base = countryEvents();
    var filtered = visibleEvents();
    var showActual = filtered.some(function(e){ return e.actual; });
    gridEl.style.setProperty("--econ-num-cols", showActual ? 3 : 2);

    // Impact counts on the filter chips (for the chosen currency).
    var chipCounts = { high: 0, medium: 0, low: 0 };
    base.forEach(function(e){ chipCounts[impactFilterKey(e)]++; });
    legendEl.querySelectorAll("[data-count]").forEach(function(b){ b.textContent = chipCounts[b.getAttribute("data-count")]; });

    var byDate = {};
    filtered.forEach(function(e){ (byDate[e.dateObj.toDateString()] = byDate[e.dateObj.toDateString()] || []).push(e); });

    daysEl.innerHTML = week.days.map(function(d, i){
      var key = d.toDateString(), evs = byDate[key] || [];
      var hi = evs.filter(function(e){ return impactClass(e.impact) === "high"; }).length;
      var md = evs.filter(function(e){ return impactClass(e.impact) === "medium"; }).length;
      var marks = "";
      for (var k = 0; k < Math.min(hi, 3); k++) marks += "<i></i>";
      for (var j = 0; j < Math.min(md, 3 - Math.min(hi, 3)); j++) marks += '<i class="m"></i>';
      return '<button type="button" class="econ-day-btn' + (key === todayKey ? " today" : "") + '" data-day="' + i + '" aria-label="' +
        DAY_LONG[d.getDay()] + ", " + evs.length + ' events">' +
        '<span class="dn">' + DAY_NAMES[d.getDay()] + '</span><span class="dd">' + d.getDate() + '</span><span class="dm">' + marks + '</span></button>';
    }).join("");

    renderedEvents = [];
    var anyEvents = filtered.length > 0;
    var cols = '<div class="econ-cols"><span>Time</span><span>Impact</span><span>Cur.</span><span>Event</span>' +
      (showActual ? '<span class="num">Actual</span>' : "") + '<span class="num">Forecast</span><span class="num">Previous</span><span></span></div>';
    var html = anyEvents ? cols : "";
    week.days.forEach(function(d, i){
      var key = d.toDateString();
      var evs = (byDate[key] || []).sort(function(a, b){ return a.dateObj - b.dateObj; });
      var isToday = key === todayKey;
      var hi = evs.filter(function(e){ return impactClass(e.impact) === "high"; }).length;
      html += '<section class="econ-section' + (isToday ? " today" : "") + '" data-day="' + i + '">' +
        '<div class="econ-section-head"><span class="econ-section-day">' + DAY_LONG[d.getDay()] + '</span>' +
        '<span class="econ-section-date">' + d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + '</span>' +
        (isToday ? '<span class="econ-today-badge">Today</span>' : "") +
        '<span class="econ-section-meta">' + (evs.length ? evs.length + " event" + (evs.length === 1 ? "" : "s") + (hi ? " &middot; " + hi + " high" : "") : "") + '</span></div>';
      if (!evs.length){
        html += '<div class="econ-day-empty">No releases' + (anyEvents ? " for these filters" : "") + '.</div>';
      }
      var nowPlaced = !isToday;
      evs.forEach(function(e){
        if (!nowPlaced && !isPast(e, now)){
          html += '<div class="econ-now" id="econNow"><span>NOW &middot; ' + fmtTime(new Date(now)) + '</span></div>';
          nowPlaced = true;
        }
        var idx = renderedEvents.push(e) - 1;
        var c = impactClass(e.impact);
        html += '<button type="button" class="econ-row' + (isPast(e, now) ? " past" : "") + (c === "high" ? " is-high" : "") + '" data-idx="' + idx + '">' +
          '<span class="econ-time">' + eventTime(e) + '</span>' +
          '<span class="econ-impact-cell">' + impactBars(c) + '<span class="econ-impact-label ' + c + '">' + impactLabel(c) + '</span></span>' +
          '<span class="econ-ccy-cell">' + ccyChip(e.country) + '</span>' +
          '<span class="econ-title">' + escapeHtml(e.title) +
            '<small>' + ccyChip(e.country) + impactBars(c) +
              (e.forecast ? '<span>F ' + escapeHtml(e.forecast) + '</span>' : "") +
              (e.previous ? '<span>P ' + escapeHtml(e.previous) + '</span>' : "") + '</small></span>' +
          (showActual ? '<span class="num' + (e.actual ? "" : " dim") + '">' + (e.actual ? escapeHtml(e.actual) : "—") + '</span>' : "") +
          '<span class="num' + (e.forecast ? "" : " dim") + '">' + (e.forecast ? escapeHtml(e.forecast) : "—") + '</span>' +
          '<span class="num' + (e.previous ? "" : " dim") + '">' + (e.previous ? escapeHtml(e.previous) : "—") + '</span>' +
          CHEVRON +
        '</button>';
      });
      if (!nowPlaced && evs.length) html += '<div class="econ-now" id="econNow"><span>NOW &middot; ' + fmtTime(new Date(now)) + '</span></div>';
      html += '</section>';
    });
    if (!anyEvents){
      html = '<div class="econ-message">No releases match these filters this week.' +
        (countrySelect.value ? '<br><button type="button" id="econShowAll">Show all currencies</button>' : "") + '</div>';
    }
    var keepScroll = gridEl.scrollTop;
    gridEl.innerHTML = html;
    renderNext();
    renderWeek(base.filter(function(e){ return activeImpacts[impactFilterKey(e)]; }));
    markCurrentDay();
    if (!scrolledToNow){
      scrolledToNow = true;
      var target = document.getElementById("econNow") || gridEl.querySelector('.econ-section.today');
      if (target){
        gridEl.style.scrollBehavior = "auto";
        gridEl.scrollTop = Math.max(0, target.offsetTop - 120);
        gridEl.style.scrollBehavior = "";
      }
    } else {
      gridEl.scrollTop = keepScroll;
    }
  }

  // On phones and short windows the whole page scrolls instead of the
  // agenda (see the CSS); these read and move whichever one does.
  function agendaPageScrolls(){ return getComputedStyle(gridEl).overflowY === "visible"; }
  function agendaScrollTop(){ return agendaPageScrolls() ? -gridEl.getBoundingClientRect().top : gridEl.scrollTop; }
  function agendaAtBottom(){
    if (!agendaPageScrolls()) return gridEl.scrollTop + gridEl.clientHeight >= gridEl.scrollHeight - 2;
    return window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
  }
  function scrollAgendaTo(top){
    if (agendaPageScrolls()) window.scrollTo({ top: window.scrollY + gridEl.getBoundingClientRect().top + top, behavior: "smooth" });
    else gridEl.scrollTo({ top: top, behavior: "smooth" });
  }

  // Highlight the day strip button for the section at the top of the list.
  var pinnedDay = null;
  function markCurrentDay(){
    var sections = gridEl.querySelectorAll(".econ-section");
    var scrollTop = agendaScrollTop(), top = scrollTop + 40, current = 0;
    sections.forEach(function(sec){ if (sec.offsetTop <= top) current = Number(sec.getAttribute("data-day")); });
    // A clicked day stays marked, even if it's near the end and the list
    // can't scroll it all the way to the top.
    if (pinnedDay !== null){
      var pinned = gridEl.querySelector('.econ-section[data-day="' + pinnedDay + '"]');
      if (pinned && (Math.abs(pinned.offsetTop - 34 - scrollTop) < 4 || (agendaAtBottom() && pinned.offsetTop > scrollTop))) current = pinnedDay;
      else if (pinned && current === pinnedDay) pinnedDay = null;
    }
    daysEl.querySelectorAll(".econ-day-btn").forEach(function(b){ b.classList.toggle("current", Number(b.getAttribute("data-day")) === current); });
  }
  gridEl.addEventListener("scroll", markCurrentDay, { passive: true });
  window.addEventListener("scroll", function(){ if (document.body.classList.contains("econ-active") && agendaPageScrolls()) markCurrentDay(); }, { passive: true });
  document.addEventListener("wheel", function(){ pinnedDay = null; }, { passive: true });
  document.addEventListener("touchstart", function(){ pinnedDay = null; }, { passive: true });
  daysEl.addEventListener("click", function(e){
    var btn = e.target.closest(".econ-day-btn");
    if (!btn) return;
    var day = btn.getAttribute("data-day");
    var sec = gridEl.querySelector('.econ-section[data-day="' + day + '"]');
    if (!sec) return;
    daysEl.querySelectorAll(".econ-day-btn").forEach(function(b){ b.classList.toggle("current", b === btn); });
    pinnedDay = Number(day);
    scrollAgendaTo(sec.offsetTop - 34);
  });

  function openEventModal(ev){
    var impactCls = impactClass(ev.impact);
    var impactLabel = impactCls.charAt(0).toUpperCase() + impactCls.slice(1);
    var rows = [
      ["Date", ev.dateObj.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })],
      ["Time", fmtTime(ev.dateObj)],
      ["Country", ev.country],
    ];
    if (ev.forecast) rows.push(["Forecast", ev.forecast]);
    if (ev.previous) rows.push(["Previous", ev.previous]);

    modalEl.innerHTML =
      '<div class="cal-modal-head">' +
        '<span class="cal-modal-title">' + escapeHtml(ev.title) + '</span>' +
        '<span class="cal-modal-head-right">' +
          '<span class="cal-modal-impact ' + impactCls + '"><span class="cal-event-dot ' + impactCls + '" aria-hidden="true"></span>' + impactLabel + '</span>' +
          '<button type="button" class="cal-modal-close" id="calModalX" aria-label="Close">&times;</button>' +
        '</span>' +
      '</div>' +
      rows.map(function(r){
        return '<div class="cal-modal-row"><span class="cal-modal-row-label">' + r[0] + '</span><span class="cal-modal-row-value">' + escapeHtml(r[1]) + '</span></div>';
      }).join("") +
      '<div class="cal-modal-about"><h3>About this event</h3><p>' + describeEvent(ev) + '</p></div>' +
      '<div class="cal-modal-foot"><button type="button" class="cal-modal-close-btn" id="calModalClose">Close</button></div>';

    overlayEl.classList.add("open");
    document.getElementById("calModalX").addEventListener("click", closeEventModal);
    document.getElementById("calModalClose").addEventListener("click", closeEventModal);
  }

  function closeEventModal(){
    overlayEl.classList.remove("open");
  }

  var overlayMouseDownOnBackdrop = false;
  overlayEl.addEventListener("mousedown", function(e){ overlayMouseDownOnBackdrop = e.target === overlayEl; });
  overlayEl.addEventListener("click", function(e){
    if (e.target === overlayEl && overlayMouseDownOnBackdrop) closeEventModal();
    overlayMouseDownOnBackdrop = false;
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && overlayEl.classList.contains("open")) closeEventModal();
  });

  gridEl.addEventListener("click", function(e){
    if (e.target.id === "econShowAll"){ countrySelect.value = ""; renderAll(); return; }
    var btn = e.target.closest(".econ-row");
    if (!btn) return;
    var ev = renderedEvents[parseInt(btn.getAttribute("data-idx"), 10)];
    if (ev) openEventModal(ev);
  });
  weekEl.addEventListener("click", function(e){
    var btn = e.target.closest(".econ-key");
    if (!btn) return;
    var ev = renderedEvents[parseInt(btn.getAttribute("data-idx"), 10)];
    if (ev) openEventModal(ev);
  });

  countrySelect.addEventListener("change", renderAll);

  legendEl.addEventListener("click", function(e){
    var btn = e.target.closest(".econ-chip");
    if (!btn) return;
    var impact = btn.getAttribute("data-impact");
    activeImpacts[impact] = !activeImpacts[impact];
    btn.classList.toggle("active", activeImpacts[impact]);
    renderAll();
  });

  try {
    var tzPart = new Intl.DateTimeFormat(undefined, { timeZoneName: "short" }).formatToParts(new Date())
      .filter(function(p){ return p.type === "timeZoneName"; })[0];
    tzEl.textContent = tzPart ? "Times in " + tzPart.value : "";
  } catch (err) {}

  function load(){
    loadState = "loading";
    fetch(FEED_URL)
      .then(function(res){ return res.json(); })
      .then(function(data){
        allEvents = (Array.isArray(data) ? data : []).map(function(e){
          return {
            title: e.title,
            country: e.country,
            impact: e.impact,
            actual: e.actual || "",
            forecast: e.forecast || "",
            previous: e.previous || "",
            dateObj: new Date(e.date),
          };
        }).filter(function(e){ return e.title && e.dateObj && !isNaN(e.dateObj.getTime()); });
        loadState = "ready";
        renderAll();
      })
      .catch(function(){
        loadState = "failed";
        nextEl.innerHTML = '<div class="econ-eyebrow">Up next</div><div class="econ-next-empty">The calendar feed isn&rsquo;t responding.</div>';
        weekEl.innerHTML = "";
        gridEl.innerHTML = '<div class="econ-message">Couldn&rsquo;t load the calendar right now.<br><button type="button" id="econRetry">Try again</button></div>';
        document.getElementById("econRetry").addEventListener("click", function(){
          gridEl.innerHTML = '<div class="econ-skeleton"></div><div class="econ-skeleton"></div><div class="econ-skeleton"></div>';
          load();
        });
      });
  }
  // Only when the Economic Calendar is the view being shown.
  if (new URLSearchParams(window.location.search).get("view") === "econ") load();
  // Live countdown, and past/now markers kept current.
  setInterval(tickCountdown, 1000);
  setInterval(function(){ if (loadState === "ready" && !document.hidden) renderAll(); }, 60000);

  // Lets the shared coach widget (coach.js) answer questions about the
  // events actually visible on screen right now, respecting the filters.
  window.EZEconPageContext = function(){
    var events = visibleEvents().slice(0, 60).map(function(e){
      return { title: e.title, country: e.country, impact: e.impact, time: e.dateObj.toISOString() };
    });
    return {
      pageName: "Economic Calendar",
      data: {
        countryFilter: countrySelect.value || "All countries",
        impactFilter: Object.keys(activeImpacts).filter(function(k){ return activeImpacts[k]; }).join(", ") || "none",
        events: events
      }
    };
  };
})();
</script>

<script>
(function(){
  "use strict";

  // ---------- View selection: P&L Calendar vs Economic Calendar ----------
  // No in-page tabs — the sidebar is the only way to switch between them
  // now (Calendar -> plain /calendar/, Economic Calendar -> ?view=econ),
  // so this just picks which panel to show once at load.
  var pnlViewEl = document.getElementById("pnlView");
  var econViewEl = document.getElementById("econView");
  var cameraToastEl = document.getElementById("pnlCameraToast");
  var calPageTitleEl = document.getElementById("calPageTitle");
  var requestedView = new URLSearchParams(window.location.search).get("view");
  var activeView = requestedView === "econ" ? "econ" : "pnl";

  pnlViewEl.hidden = activeView !== "pnl";
  econViewEl.hidden = activeView !== "econ";
  document.body.classList.toggle("econ-active", activeView === "econ");
  calPageTitleEl.textContent = activeView === "econ" ? "Economic Calendar" : "Calendar";
  document.getElementById("calPageSub").textContent = activeView === "econ"
    ? "Market-moving releases and when they hit."
    : "Your daily P&L, day by day.";
  // Only the P&L view reads journal trade data, so the account filter has
  // nothing to do on the (unrelated) Economic Calendar view.
  document.getElementById("acctFilter").hidden = activeView !== "pnl";

  // ---------- Read-only journal data (same storage shape as Journal/Dashboard) ----------
  var JOURNAL_STORAGE_KEY = "ezpayouts.journal.v1";
  var journalAccounts = [];

  function migrateJournalData(parsed){
    if (parsed && Array.isArray(parsed.accounts) && parsed.accounts.length) return parsed.accounts;
    if (parsed && Array.isArray(parsed.trades)) return [{ id: "acc_default", name: "Main", trades: parsed.trades }];
    return null;
  }
  function loadJournal(){
    try {
      var raw = localStorage.getItem(JOURNAL_STORAGE_KEY);
      var migrated = raw ? migrateJournalData(JSON.parse(raw)) : null;
      if (migrated) journalAccounts = migrated;
    } catch (err) {}
  }
  // ---------- Trading-account filter (checkboxes; defaults to all) ----------
  // Without this, every trading account's trades (e.g. a prop-firm eval
  // account and a personal one) were silently flattened together into one
  // P&L number with no way to tell them apart. null = "all accounts",
  // which also auto-includes any account added later.
  //
  // The selection itself is shared with the Dashboard's identical filter via
  // localStorage (there's no app-wide state container in this plain
  // multi-page site, so a shared storage key stands in for one) — ticking
  // accounts here carries over there, and back, without resetting.
  var ACCT_FILTER_STORAGE_KEY = "ezpayouts.acctFilter.v1";
  function loadAcctFilterSelection(){
    try {
      var raw = localStorage.getItem(ACCT_FILTER_STORAGE_KEY);
      if (raw === null) return null;
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : null;
    } catch (err) { return null; }
  }
  function saveAcctFilterSelection(ids){
    try {
      if (ids === null) localStorage.removeItem(ACCT_FILTER_STORAGE_KEY);
      else localStorage.setItem(ACCT_FILTER_STORAGE_KEY, JSON.stringify(ids));
    } catch (err) {}
  }
  var selectedAccountIds = loadAcctFilterSelection();
  var acctFilterEl = document.getElementById("acctFilter");
  var acctFilterBtn = document.getElementById("acctFilterBtn");
  var acctFilterPopover = document.getElementById("acctFilterPopover");
  var acctFilterAllCb = document.getElementById("acctFilterAll");
  var acctFilterListEl = document.getElementById("acctFilterList");
  var acctFilterLabelEl = document.getElementById("acctFilterLabel");

  function isAccountSelected(id){
    return selectedAccountIds === null || selectedAccountIds.indexOf(id) !== -1;
  }
  function selectedJournalAccounts(){
    if (selectedAccountIds === null) return journalAccounts;
    return journalAccounts.filter(function(a){ return selectedAccountIds.indexOf(a.id) !== -1; });
  }
  function renderAcctFilter(){
    if (!journalAccounts.length){
      acctFilterListEl.innerHTML = '<p class="acct-filter-empty">No trading accounts yet.</p>';
      acctFilterAllCb.checked = true;
      acctFilterAllCb.indeterminate = false;
      acctFilterLabelEl.textContent = "All Accounts";
      return;
    }
    acctFilterListEl.innerHTML = journalAccounts.map(function(a){
      var checked = isAccountSelected(a.id);
      var count = a.trades ? a.trades.length : 0;
      return '<label class="acct-filter-row"><input type="checkbox" data-id="' + escapeHtml(a.id) + '"' + (checked ? " checked" : "") + ' />' +
        '<span>' + escapeHtml(a.name) + '</span>' +
        '<span class="acct-filter-count">' + count + '</span></label>';
    }).join("");
    var selectedCount = journalAccounts.filter(function(a){ return isAccountSelected(a.id); }).length;
    var allChecked = selectedCount === journalAccounts.length;
    acctFilterAllCb.checked = allChecked;
    acctFilterAllCb.indeterminate = !allChecked && selectedCount > 0;
    if (allChecked){
      acctFilterLabelEl.textContent = "All Accounts";
    } else if (selectedCount === 0){
      acctFilterLabelEl.textContent = "No Accounts";
    } else if (selectedCount === 1){
      var only = journalAccounts.filter(function(a){ return isAccountSelected(a.id); })[0];
      acctFilterLabelEl.textContent = only.name;
    } else {
      acctFilterLabelEl.textContent = selectedCount + " Accounts";
    }
  }
  // Keeps the open dropdown on screen and clear of the sidebar. On phones
  // the button wraps to the left edge, and right-aligning the dropdown to
  // it pushed it off screen and under the sidebar.
  function placeAcctFilterPopover(){
    var pop = acctFilterPopover;
    pop.style.left = "";
    pop.style.right = "";
    pop.style.width = "";
    if (pop.hidden) return;
    var side = document.querySelector(".ez-sidebar");
    var minLeft = (side ? side.getBoundingClientRect().right : 0) + 8;
    var maxRight = document.documentElement.clientWidth - 8;
    var r = pop.getBoundingClientRect();
    if (r.width > maxRight - minLeft) pop.style.width = (maxRight - minLeft) + "px";
    r = pop.getBoundingClientRect();
    var shift = r.left < minLeft ? minLeft - r.left : (r.right > maxRight ? maxRight - r.right : 0);
    if (shift){
      var box = pop.offsetParent ? pop.offsetParent.getBoundingClientRect() : { left: 0 };
      pop.style.right = "auto";
      pop.style.left = (r.left + shift - box.left) + "px";
    }
  }
  window.addEventListener("resize", placeAcctFilterPopover);
  acctFilterBtn.addEventListener("click", function(e){
    e.stopPropagation();
    acctFilterPopover.hidden = !acctFilterPopover.hidden;
    acctFilterBtn.setAttribute("aria-expanded", acctFilterPopover.hidden ? "false" : "true");
    placeAcctFilterPopover();
  });
  document.addEventListener("click", function(e){
    if (!acctFilterPopover.hidden && !acctFilterEl.contains(e.target)) acctFilterPopover.hidden = true;
  });
  acctFilterAllCb.addEventListener("change", function(){
    selectedAccountIds = acctFilterAllCb.checked ? null : [];
    saveAcctFilterSelection(selectedAccountIds);
    renderAcctFilter();
    renderPnlCalendar();
  });
  acctFilterListEl.addEventListener("change", function(e){
    var cb = e.target.closest('input[type="checkbox"][data-id]');
    if (!cb) return;
    var current = selectedAccountIds === null ? journalAccounts.map(function(a){ return a.id; }) : selectedAccountIds.slice();
    var id = cb.getAttribute("data-id");
    if (cb.checked){
      if (current.indexOf(id) === -1) current.push(id);
    } else {
      current = current.filter(function(x){ return x !== id; });
    }
    selectedAccountIds = (current.length === journalAccounts.length) ? null : current;
    saveAcctFilterSelection(selectedAccountIds);
    renderAcctFilter();
    renderPnlCalendar();
  });

  function allTrades(){
    var out = [];
    selectedJournalAccounts().forEach(function(acc){ (acc.trades || []).forEach(function(t){ out.push(t); }); });
    return out;
  }
  function pnlByDate(){
    var map = {};
    allTrades().forEach(function(t){
      if (!t.date) return;
      if (!map[t.date]) map[t.date] = { pnl: 0, count: 0 };
      map[t.date].pnl += (Number(t.pnl) || 0);
      map[t.date].count += 1;
    });
    return map;
  }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtMoneySigned(n){
    n = Number(n) || 0;
    return (n < 0 ? "-$" : "+$") + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
  }
  function dateKey(d){
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // ---------- P&L Calendar state ----------
  var pnlMode = "month"; // "month" | "week"
  var pnlCursor = new Date(); // anchor date within the displayed month/week
  pnlCursor.setHours(0, 0, 0, 0);

  var pnlModeSwitchEl = document.getElementById("pnlModeSwitch");
  var pnlPrevBtn = document.getElementById("pnlPrevBtn");
  var pnlNextBtn = document.getElementById("pnlNextBtn");
  var pnlPeriodLabelEl = document.getElementById("pnlPeriodLabel");
  var pnlGridEl = document.getElementById("pnlGrid");
  var pnlWeekdayHeadEl = document.getElementById("pnlWeekdayHead");
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function monthDaysGrid(anchor){
    var year = anchor.getFullYear(), month = anchor.getMonth();
    var firstOfMonth = new Date(year, month, 1);
    var startOffset = firstOfMonth.getDay(); // 0=Sun
    var gridStart = new Date(year, month, 1 - startOffset);
    var days = [];
    for (var i = 0; i < 42; i++){
      var d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      days.push(d);
    }
    // Trim trailing all-outside-month rows beyond 5 full weeks when unneeded.
    while (days.length > 35 && days[days.length - 7].getMonth() !== month) days.splice(days.length - 7, 7);
    return days;
  }
  function weekDaysGrid(anchor){
    var d = new Date(anchor);
    var start = new Date(d);
    start.setDate(d.getDate() - d.getDay());
    var days = [];
    for (var i = 0; i < 7; i++){
      var dd = new Date(start);
      dd.setDate(start.getDate() + i);
      days.push(dd);
    }
    return days;
  }

  // Same card component renders both views — Month gets the full 6-week
  // grid, Week gets exactly one row of 7 taller cards (matches the
  // reference exactly: it's one cell renderer, just a different `cells`
  // array and a taller min-height class per view).
  // "+$791", "-$1.3k", "+$12k": fits a phone-width day cell.
  function fmtMoneyCompact(n){
    var a = Math.abs(n), sign = n < 0 ? "-" : "+";
    if (a < 1000) return sign + "$" + Math.round(a);
    return sign + "$" + (a / 1000).toFixed(a < 10000 ? 1 : 0).replace(/\.0$/, "") + "k";
  }
  function renderPnlCalendar(){
    var byDate = pnlByDate();
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var isMonth = pnlMode === "month";
    var days = isMonth ? monthDaysGrid(pnlCursor) : weekDaysGrid(pnlCursor);
    var refMonth = pnlCursor.getMonth();

    pnlGridEl.classList.toggle("week-view", !isMonth);

    pnlGridEl.innerHTML = days.map(function(d){
      var key = dateKey(d);
      var data = byDate[key];
      var isOutside = isMonth && d.getMonth() !== refMonth;
      var isToday = dateKey(d) === dateKey(today);
      var cls = ["pnl-day"];
      if (isOutside) cls.push("outside");
      if (isToday) cls.push("today");
      var body = "";
      if (data){
        cls.push("has-data", data.pnl >= 0 ? "win" : "loss");
        body = '<div class="pnl-day-pnl ' + (data.pnl >= 0 ? "pos" : "neg") + '">' +
            '<span class="full">' + fmtMoneySigned(data.pnl) + '</span><span class="short">' + fmtMoneyCompact(data.pnl) + '</span></div>' +
          '<div class="pnl-day-count">' + data.count + " trade" + (data.count === 1 ? "" : "s") + '</div>';
      }
      return '<div class="' + cls.join(" ") + '" data-date="' + key + '"' + (isOutside ? "" : ' tabindex="0" role="button"') + '>' +
        '<span class="pnl-day-num">' + d.getDate() + '</span>' +
        body +
      '</div>';
    }).join("");

    if (isMonth){
      pnlPeriodLabelEl.textContent = MONTH_NAMES[pnlCursor.getMonth()] + " " + pnlCursor.getFullYear();
    } else {
      var s = days[0], e = days[6];
      var sameMonth = s.getMonth() === e.getMonth();
      var startStr = MONTH_ABBR[s.getMonth()] + " " + s.getDate();
      var endStr = (sameMonth ? "" : MONTH_ABBR[e.getMonth()] + " ") + e.getDate() + ", " + e.getFullYear();
      pnlPeriodLabelEl.textContent = startStr + " – " + endStr;
    }
  }

  // Clicking a day fires a brief neon flash, then routes to the Journal's
  // Daily tab scrolled to (and flash-highlighted on) that date — pure page
  // routing only. This never opens the trade logger: an empty day still
  // lands on the Daily tab, just with nothing to scroll to.
  function handleDayCardClick(cardEl){
    if (!cardEl || cardEl.classList.contains("outside")) return;
    var date = cardEl.getAttribute("data-date");
    if (!date) return;
    cardEl.classList.add("flash");
    setTimeout(function(){
      window.location.href = "/journal/?scrollTo=" + encodeURIComponent(date);
    }, 380);
  }
  pnlGridEl.addEventListener("click", function(e){
    handleDayCardClick(e.target.closest(".pnl-day"));
  });
  pnlGridEl.addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    var card = e.target.closest(".pnl-day");
    if (!card) return;
    e.preventDefault();
    handleDayCardClick(card);
  });

  pnlModeSwitchEl.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    var mode = btn.getAttribute("data-mode");
    if (mode === pnlMode) return;
    pnlMode = mode;
    pnlModeSwitchEl.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active", b === btn); });
    renderPnlCalendar();
  });
  pnlPrevBtn.addEventListener("click", function(){
    if (pnlMode === "month") pnlCursor.setMonth(pnlCursor.getMonth() - 1);
    else pnlCursor.setDate(pnlCursor.getDate() - 7);
    renderPnlCalendar();
  });
  pnlNextBtn.addEventListener("click", function(){
    if (pnlMode === "month") pnlCursor.setMonth(pnlCursor.getMonth() + 1);
    else pnlCursor.setDate(pnlCursor.getDate() + 7);
    renderPnlCalendar();
  });
  pnlPeriodLabelEl.addEventListener("click", function(){
    pnlCursor = new Date();
    pnlCursor.setHours(0, 0, 0, 0);
    renderPnlCalendar();
  });

  window.addEventListener("storage", function(e){
    if (e.key === JOURNAL_STORAGE_KEY){ loadJournal(); renderAcctFilter(); renderPnlCalendar(); }
    if (e.key === ACCT_FILTER_STORAGE_KEY){ selectedAccountIds = loadAcctFilterSelection(); renderAcctFilter(); renderPnlCalendar(); }
  });
  window.addEventListener("focus", function(){ loadJournal(); renderAcctFilter(); renderPnlCalendar(); });
  // Pull in trades logged on other devices (sync.js); re-render if
  // the merge changed anything.
  if (window.EZSync){
    EZSync.onUpdate(function(e){
      if (e.channels.indexOf("journal") !== -1){ loadJournal(); renderAcctFilter(); renderPnlCalendar(); }
    });
    EZSync.sync();
  }

  // Signing out clears this page's view back to blank instead of continuing
  // to show whatever account was last synced to this device's shared
  // "ezpayouts.journal.v1" storage — mirrors the same reset on the Journal
  // and Dashboard pages.
  if (window.EZAuth){
    EZAuth.onChange(function(loggedIn){
      if (!loggedIn){
        try { localStorage.removeItem(JOURNAL_STORAGE_KEY); } catch (err) {}
        journalAccounts = [];
        selectedAccountIds = null;
        saveAcctFilterSelection(null);
      } else {
        loadJournal();
      }
      renderAcctFilter();
      renderPnlCalendar();
    });
  }

  // ---------- Camera menu: Copy Screenshot to Clipboard / Open Card Editor ----------
  var pnlCameraBtn = document.getElementById("pnlCameraBtn");
  var pnlCameraMenu = document.getElementById("pnlCameraMenu");
  var pnlCopyScreenshotBtn = document.getElementById("pnlCopyScreenshotBtn");
  var pnlOpenEditorBtn = document.getElementById("pnlOpenEditorBtn");

  function closeCameraMenu(){ pnlCameraMenu.hidden = true; }
  pnlCameraBtn.addEventListener("click", function(e){
    e.stopPropagation();
    pnlCameraMenu.hidden = !pnlCameraMenu.hidden;
  });
  document.addEventListener("click", function(e){
    if (!pnlCameraMenu.hidden && !pnlCameraMenu.contains(e.target) && e.target !== pnlCameraBtn) closeCameraMenu();
  });

  function showToast(msg){
    cameraToastEl.textContent = msg;
    cameraToastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ cameraToastEl.classList.remove("show"); }, 2600);
  }

  // ---------- Native canvas snapshot renderer ----------
  // DOM-screenshot libraries (html2canvas et al.) are unreliable here: they
  // routinely drop gradient backgrounds, flatten border-radius, and ignore
  // CSS grid gaps. Instead we draw the calendar grid straight onto a canvas,
  // mirroring .pnl-day's exact colors/gradients/radii ourselves — the output
  // is pixel-perfect and never depends on how a third-party lib interprets
  // our CSS.
  // A theme color (nav.js tokens) for the snapshot canvas, which can't
  // use CSS variables directly.
  function themeColor(name, fallback){
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }
  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function buildCalendarSnapshotCanvas(){
    var byDate = pnlByDate();
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var isMonth = pnlMode === "month";
    var days = isMonth ? monthDaysGrid(pnlCursor) : weekDaysGrid(pnlCursor);
    var refMonth = pnlCursor.getMonth();
    var rows = isMonth ? days.length / 7 : 1;

    var dpr = Math.max(2, Math.min(3, window.devicePixelRatio || 1));
    var padding = 28, headerH = 44, weekdayH = 26, gap = 10;
    var cellW = 150, cellH = isMonth ? 106 : 150;
    var gridW = 7 * cellW + 6 * gap;
    var gridH = rows * cellH + (rows - 1) * gap;
    var W = gridW + padding * 2;
    var H = padding * 2 + headerH + weekdayH + gridH;

    var canvas = document.createElement("canvas");
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    var ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, themeColor("--ez-cal-top", "#141b2d"));
    bgGrad.addColorStop(1, themeColor("--ez-cal-bottom", "#0e1424"));
    roundRectPath(ctx, 0, 0, W, H, 16);
    ctx.fillStyle = bgGrad;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = themeColor("--hairline-bright", "#243153");
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "600 18px 'Chakra Petch', 'Segoe UI', sans-serif";
    ctx.fillText((pnlPeriodLabelEl.textContent || "").trim(), W / 2, padding + headerH / 2);

    var weekdayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    ctx.font = "400 12px 'IBM Plex Sans', 'Segoe UI', sans-serif";
    ctx.fillStyle = themeColor("--muted-dim", "#64748b");
    var weekdayY = padding + headerH + weekdayH / 2;
    for (var c = 0; c < 7; c++){
      ctx.fillText(weekdayNames[c], padding + c * (cellW + gap) + cellW / 2, weekdayY);
    }

    var gridTop = padding + headerH + weekdayH;
    days.forEach(function(d, i){
      var isOutside = isMonth && d.getMonth() !== refMonth;
      if (isOutside) return; // CSS uses visibility:hidden for these — leave the cell blank

      var col = i % 7, row = Math.floor(i / 7);
      var x = padding + col * (cellW + gap);
      var y = gridTop + row * (cellH + gap);
      var key = dateKey(d);
      var data = byDate[key];
      var isToday = dateKey(d) === dateKey(today);
      var isWin = !!data && data.pnl >= 0;

      roundRectPath(ctx, x, y, cellW, cellH, 12);
      if (data){
        var grad = ctx.createLinearGradient(x, y, x + cellW, y + cellH);
        if (isWin){
          grad.addColorStop(0, themeColor("--ez-win-a", "rgba(59,130,246,0.3)"));
          grad.addColorStop(0.5, themeColor("--ez-win-b", "rgba(79,70,229,0.2)"));
          grad.addColorStop(1, themeColor("--ez-win-c", "rgba(30,27,75,0.4)"));
        } else {
          grad.addColorStop(0, "rgba(244,63,94,0.25)");
          grad.addColorStop(0.5, "rgba(136,19,55,0.2)");
          grad.addColorStop(1, "rgba(26,15,28,0.6)");
        }
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = themeColor("--ez-cal-cell", "rgba(14,20,36,0.6)");
      }
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = data ? (isWin ? themeColor("--ez-win-line", "rgba(96,165,250,0.4)") : "rgba(251,113,133,0.35)") : themeColor("--ez-cal-cell-border", "#1b2540");
      ctx.stroke();

      if (isToday){
        roundRectPath(ctx, x + 1.5, y + 1.5, cellW - 3, cellH - 3, 11);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(" + themeColor("--ez-focus-rgb", "59,130,246") + ",0.6)";
        ctx.stroke();
      }

      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillStyle = themeColor("--ez-btn-text", "#cbd5e1");
      ctx.font = "500 13px 'IBM Plex Sans', 'Segoe UI', sans-serif";
      ctx.fillText(String(d.getDate()), x + 10, y + 9);

      if (data){
        ctx.font = "600 15px 'Chakra Petch', 'Segoe UI', sans-serif";
        ctx.fillStyle = isWin ? "#a5f3fc" : "#fda4af";
        ctx.fillText(fmtMoneySigned(data.pnl), x + 10, y + 31);

        ctx.font = "400 11px 'IBM Plex Sans', 'Segoe UI', sans-serif";
        ctx.fillStyle = themeColor("--muted", "#94a3b8");
        ctx.fillText(data.count + " trade" + (data.count === 1 ? "" : "s"), x + 10, y + 54);
      }
    });

    return canvas;
  }

  function deliverSnapshotBlob(blob){
    if (!blob){ showToast("Couldn't generate the image."); return; }
    if (navigator.clipboard && window.ClipboardItem){
      navigator.clipboard.write([ new ClipboardItem({ "image/png": blob }) ])
        .then(function(){ showToast("Calendar snapshot copied to clipboard!"); })
        .catch(function(){
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "ezpayouts-calendar.png";
          a.click();
          showToast("Clipboard unavailable — downloaded instead.");
        });
    } else {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ezpayouts-calendar.png";
      a.click();
      showToast("Clipboard unavailable — downloaded instead.");
    }
  }

  pnlCopyScreenshotBtn.addEventListener("click", function(){
    closeCameraMenu();
    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    ready.then(function(){
      try {
        var canvas = buildCalendarSnapshotCanvas();
        canvas.toBlob(deliverSnapshotBlob, "image/png");
      } catch (err){
        showToast("Couldn't capture the calendar. Try again.");
      }
    });
  });

  pnlOpenEditorBtn.addEventListener("click", function(){
    closeCameraMenu();
    var anchor = pnlMode === "month"
      ? new Date(pnlCursor.getFullYear(), pnlCursor.getMonth(), 1)
      : weekDaysGrid(pnlCursor)[0];
    var dateParam = dateKey(anchor);
    window.location.href = "/journal/?share=monthly&date=" + encodeURIComponent(dateParam);
  });

  // Lets the shared coach widget answer questions about whichever calendar
  // view is currently on screen.
  window.EZPageContext = function(){
    if (activeView === "econ" && typeof window.EZEconPageContext === "function") return window.EZEconPageContext();
    var byDate = pnlByDate();
    var days = pnlMode === "month" ? monthDaysGrid(pnlCursor) : weekDaysGrid(pnlCursor);
    var daysData = days.filter(function(d){
      return pnlMode === "week" || d.getMonth() === pnlCursor.getMonth();
    }).map(function(d){
      var key = dateKey(d);
      var data = byDate[key];
      return { date: key, pnl: data ? data.pnl : 0, trades: data ? data.count : 0 };
    });
    return {
      pageName: "P&L Calendar",
      data: { mode: pnlMode, period: pnlPeriodLabelEl.textContent, days: daysData }
    };
  };

  loadJournal();
  renderAcctFilter();
  renderPnlCalendar();
})();
</script>
</body>
</html>
