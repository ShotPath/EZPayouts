name: Update News Feed

on:
  schedule:
    # Every 30 minutes. GitHub only fires scheduled workflows from the
    # repo's default branch, so this file must live there.
    - cron: "0,30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch RSS feeds and update news/data.json
        run: node .github/scripts/update-news.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/data.json
          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "Auto-update news feed"
            git push
          fi
