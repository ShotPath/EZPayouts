<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EZPayouts News</title>
<link rel="icon" type="image/png" href="../ezpayouts-icon-only.png">
<link rel="apple-touch-icon" href="../ezpayouts-icon-only.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --void:#07090a;
    --panel:#0c1310;
    --panel-raised:#121b16;
    --panel-hi:#182319;
    --hairline:#23332a;
    --hairline-bright:#345a44;
    --phosphor:#3ee08c;
    --phosphor-soft:#8fe6b6;
    --phosphor-dim:#1c5c3d;
    --mint:#7ee8ac;
    --mint-text:#062b17;
    --red:#ef5a5a;
    --red-glow:rgba(239,90,90,0.35);
    --ice:#dcefe2;
    --muted:#7c9584;
    --muted-dim:#4d6055;
    --font-display:'Chakra Petch', 'Segoe UI', sans-serif;
    --font-body:'IBM Plex Sans', 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }

  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(62,224,140,0.10), transparent 60%),
      radial-gradient(ellipse 80% 50% at 100% 100%, rgba(62,224,140,0.06), transparent 60%),
      var(--void);
    color:var(--ice);
    font-family:var(--font-body);
    padding:0 clamp(16px,4vw,48px);
    padding-block:clamp(18px,3.4vw,32px) 60px;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(62,224,140,0.035) 0px,
      rgba(62,224,140,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
    z-index:0;
    animation:scan 9s linear infinite;
  }
  @keyframes scan{
    0%{ background-position:0 0; }
    100%{ background-position:0 120px; }
  }
  @media (prefers-reduced-motion: reduce){
    body::before{ animation:none; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .wrap{ max-width:720px; margin:0 auto; position:relative; z-index:1; }

  h1,h2{ font-family:var(--font-display); text-wrap:balance; margin:0; }
  a{ color:var(--phosphor-soft); }

  .topbar{ display:flex; align-items:center; padding-bottom:16px; margin-bottom:8px; border-bottom:1px solid var(--hairline); }
  .brand{ display:flex; align-items:center; gap:11px; text-decoration:none; }
  .brand-mark{ width:34px; height:34px; flex:none; object-fit:contain; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-name{ font-family:var(--font-display); font-weight:700; font-size:16.5px; letter-spacing:0.02em; color:var(--ice); }
  .brand-sub{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted-dim); }

  .hero{ max-width:560px; margin:0 auto; text-align:center; padding:64px 0 46px; }
  .hero .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--phosphor); margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .hero .eyebrow::before{ content:"//"; color:var(--muted-dim); }
  .hero h1{ font-size:clamp(28px,5vw,40px); font-weight:700; line-height:1.1; color:var(--ice); letter-spacing:-0.01em; }
  .hero p{ margin:16px auto 0; color:var(--muted); font-size:15.5px; line-height:1.65; }

  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  .news-feed{ display:flex; flex-direction:column; gap:14px; margin-top:8px; }
  .news-item{
    background:var(--panel); border:1px solid var(--hairline); border-radius:16px;
    padding:16px 20px; text-align:left;
  }
  .news-item-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .news-item-dot{
    width:7px; height:7px; border-radius:50%; flex:none;
    background:var(--phosphor); box-shadow:0 0 8px 2px rgba(62,224,140,0.35);
  }
  .news-item-time{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.03em; color:var(--muted); }
  .news-item-badge{
    font-family:var(--font-mono); font-size:9px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700;
    padding:2px 8px; border-radius:999px; background:var(--red); color:#2b0808;
  }
  .news-item-title{ font-family:var(--font-display); font-weight:600; font-size:16px; color:var(--ice); line-height:1.4; margin:0; }
  .news-item-summary{ margin:8px 0 0; font-size:13.5px; color:var(--muted); line-height:1.6; }
  .news-empty{ color:var(--muted); font-size:14px; text-align:center; padding:24px 0; }

  .news-item.major{ border-color:var(--red); background:rgba(239,90,90,0.08); }
  .news-item.major .news-item-dot{
    background:var(--red); box-shadow:0 0 10px 3px var(--red-glow); animation:pulse 1.4s ease-in-out infinite;
  }
  .news-item.major .news-item-time{ color:var(--red); }

  footer{ margin-top:52px; text-align:center; }
  footer p{ font-size:12px; color:var(--muted-dim); line-height:1.7; margin:0; }
  footer a{ color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <a class="brand" href="../" aria-label="Back to EZPayouts">
      <img class="brand-mark" src="../ezpayouts-icon-only.png" alt="" aria-hidden="true" />
      <span class="brand-text">
        <span class="brand-name">News</span>
        <span class="brand-sub">by ShotPath</span>
      </span>
    </a>
  </header>

  <div class="hero">
    <div class="eyebrow">Market News</div>
    <h1>What just happened?</h1>
    <p>Market-moving headlines, posted as they happen &mdash; so the next wild wick doesn't catch you off guard. Anything marked <b style="color:var(--red);">Major</b> is worth a second look before your next trade.</p>
  </div>

  <div class="news-feed" id="newsFeed">
    <p class="news-empty">Loading headlines&hellip;</p>
  </div>

  <footer>
    <p><a href="../">&larr; Back to EZPayouts</a> &middot; Built by ShotPath</p>
  </footer>

</div>

<script>
(function(){
  "use strict";

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function timeAgo(iso){
    var then = new Date(iso).getTime();
    var diff = Math.max(0, Date.now() - then);
    var sec = Math.floor(diff / 1000);
    if (sec < 60) return "just now";
    var min = Math.floor(sec / 60);
    if (min < 60) return min + "m ago";
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + "h ago";
    var day = Math.floor(hr / 24);
    if (day < 7) return day + "d ago";
    var week = Math.floor(day / 7);
    if (week < 5) return week + "w ago";
    var month = Math.floor(day / 30);
    if (month < 12) return month + "mo ago";
    return Math.floor(day / 365) + "y ago";
  }

  var feedEl = document.getElementById("newsFeed");
  var items = [];
  var MAX_ITEMS = 25;
  var FEED_URL = "https://ezpayouts-news.ezpayouts.workers.dev";

  function render(){
    if (!items.length){
      feedEl.innerHTML = '<p class="news-empty">No headlines yet &mdash; check back soon.</p>';
      return;
    }
    var sorted = items.slice().sort(function(a, b){
      return new Date(b.timestamp) - new Date(a.timestamp);
    }).slice(0, MAX_ITEMS);
    feedEl.innerHTML = sorted.map(function(item){
      var isMajor = !!item.major;
      return '' +
        '<article class="news-item' + (isMajor ? " major" : "") + '">' +
          '<div class="news-item-head">' +
            '<span class="news-item-dot" aria-hidden="true"></span>' +
            '<span class="news-item-time">' + timeAgo(item.timestamp) + '</span>' +
            (isMajor ? '<span class="news-item-badge">Major</span>' : '') +
          '</div>' +
          '<h3 class="news-item-title">' + escapeHtml(item.title) + '</h3>' +
          (item.summary ? '<p class="news-item-summary">' + escapeHtml(item.summary) + '</p>' : '') +
        '</article>';
    }).join("");
  }

  function load(){
    fetch(FEED_URL)
      .then(function(res){ return res.json(); })
      .then(function(data){
        items = Array.isArray(data) ? data : [];
        render();
      })
      .catch(function(){
        if (!items.length){
          feedEl.innerHTML = '<p class="news-empty">Couldn’t load the news feed right now.</p>';
        }
      });
  }

  load();
  setInterval(load, 10000);
})();
</script>
</body>
</html>
