<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZPayouts</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="head">
    <img class="logo" src="../icons/icon-48.png" alt="">
    <div class="brand">
      <div class="name">EZPayouts</div>
    </div>
    <button class="pro-btn" id="proBtn" type="button" title="EZPayouts Pro unlocks every look">Go Pro</button>
  </header>

  <!-- Two sides: Chart Skins (TradingView) and Risk Management (Tradovate). -->
  <div class="seg seg-wide views" id="views" role="tablist" aria-label="EZPayouts">
    <button type="button" role="tab" data-view="skins" aria-checked="true">Chart Skins</button>
    <button type="button" role="tab" data-view="risk" aria-checked="false">Risk Management</button>
  </div>

  <div id="skinsView">

  <div class="site" id="site" hidden>
    <span class="site-dot" id="siteDot"></span>
    <span class="site-text" id="siteText"></span>
    <button class="site-btn" id="siteBtn" type="button" hidden></button>
  </div>
  <p class="tip" id="tip" hidden></p>

  <!-- Three things, each with its own switch: the wallpaper behind the
       chart, the order tags on it and the Long/Short Position tool. A card
       shows that one's settings below. -->
  <div class="modes" role="tablist" aria-label="Settings">
    <div class="mode" role="tab" data-mode="wallpaper" tabindex="0">
      <div class="mode-text"><span class="mode-name">Wallpaper</span><span class="mode-sub" id="wallSub"></span></div>
      <label class="switch" title="Wallpaper on or off (Alt+Shift+B)">
        <input type="checkbox" id="enabled" role="switch" aria-label="Wallpaper">
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>
    <div class="mode" role="tab" data-mode="tags" tabindex="0">
      <div class="mode-text" title="Restyles your order, position and P&amp;L tags, their lines and their prices on the price scale."><span class="mode-name">Order tags</span><span class="mode-sub" id="tagsSub"></span></div>
      <label class="switch" title="Order tags on or off">
        <input type="checkbox" id="tagsEnabled" role="switch" aria-label="Order tags">
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>
    <div class="mode" role="tab" data-mode="pos" tabindex="0">
      <div class="mode-text" title="Restyles TradingView's Long Position and Short Position drawing tools."><span class="mode-name">Position</span><span class="mode-sub" id="posSub"></span></div>
      <label class="switch" title="Position tool theme on or off">
        <input type="checkbox" id="posEnabled" role="switch" aria-label="Position tool">
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>
  </div>

  <div id="wallPanel" role="tabpanel">
  <section>
    <div class="section-head">
      <div class="tabs" id="skinTabs" role="tablist" aria-label="Skins">
        <button type="button" role="tab" data-tab="live">Animated</button>
        <button type="button" role="tab" data-tab="video">Videos</button>
      </div>
      <button class="link" id="uploadBtn" type="button">Upload your own</button>
    </div>
    <div class="grid" id="grid" role="radiogroup" aria-label="Skin"></div>
    <input type="file" id="file" accept="video/mp4,video/webm,video/quicktime,image/gif,image/png,image/jpeg,image/webp" hidden>
    <p class="note" id="uploadNote" hidden></p>
  </section>

  <section>
    <div class="section-head">
      <h2>Adjust</h2>
      <button class="link" id="resetBtn" type="button">Reset</button>
    </div>
    <div class="controls">
      <label class="ctl"><span class="ctl-label">Strength</span><output id="strengthOut" for="strength"></output>
        <input type="range" id="strength" min="0" max="100" step="1"></label>
      <label class="ctl"><span class="ctl-label">Dim</span><output id="dimOut" for="dim"></output>
        <input type="range" id="dim" min="0" max="90" step="1"></label>
      <label class="ctl"><span class="ctl-label">Blur</span><output id="blurOut" for="blur"></output>
        <input type="range" id="blur" min="0" max="20" step="1"></label>
      <label class="ctl"><span class="ctl-label">Speed</span><output id="speedOut" for="speed"></output>
        <input type="range" id="speed" min="0.25" max="3" step="0.05"></label>
      <div class="ctl ctl-row">
        <span class="ctl-label">Frame rate</span>
        <div class="seg" id="fps" role="radiogroup" aria-label="Frame rate">
          <button type="button" role="radio" data-fps="30">30 fps</button>
          <button type="button" role="radio" data-fps="60">60 fps</button>
        </div>
      </div>
    </div>
  </section>
  </div>

  <div id="tagsPanel" role="tabpanel" hidden>
    <div class="tag-preview" id="tagPreview" aria-hidden="true"></div>
    <section>
      <div class="section-head"><h2>Colors</h2></div>
      <div class="swatches" id="tagColorGrid" role="radiogroup" aria-label="Tag colors"></div>
    </section>
    <section>
      <div class="section-head"><h2>Style</h2></div>
      <div class="style-grid" id="tagStyle" role="radiogroup" aria-label="Tag style"></div>
    </section>
  </div>

  <div id="posPanel" role="tabpanel" hidden>
    <div class="pos-preview" id="posPreview" aria-hidden="true">
      <div class="pv-tool">
        <div class="pv-target"></div><div class="pv-stop"></div>
        <i class="pv-spark" style="left:-2px;top:-2px"></i><i class="pv-spark" style="right:-2px;top:-2px"></i>
        <i class="pv-spark" style="left:-2px;bottom:-2px"></i><i class="pv-spark" style="right:-2px;bottom:-2px"></i>
        <span class="pv-label pv-t" style="top:0">82.75</span>
        <span class="pv-label pv-e" style="top:50%">2.65</span>
        <span class="pv-label pv-s" style="top:100%">31.25</span>
      </div>
    </div>
    <section>
      <div class="section-head"><h2>Theme</h2></div>
      <div class="swatches" id="posThemeGrid" role="radiogroup" aria-label="Position tool theme"></div>
    </section>
    <p class="note">Draw a Long or Short Position on your chart; it takes this look.</p>
  </div>

  </div>

  <div id="riskView" hidden>
    <div class="site">
      <span class="site-dot" id="riskDot"></span>
      <span class="site-text" id="riskText">Open TradingView's trading panel.</span>
      <label class="switch" title="Risk Management on or off">
        <input type="checkbox" id="riskOn" role="switch" aria-label="Risk Management">
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>
    <div class="r-stats" id="riskStats" hidden>
      <div><span>Start of day</span><b id="sStart"></b></div>
      <div><span>Balance now</span><b id="sNow"></b></div>
      <div><span id="sRoomLabel">Room (DLL)</span><b id="sRoom"></b></div>
    </div>
    <div class="r-lock" id="riskLock" hidden></div>
    <section>
      <div class="section-head"><h2>Limits</h2><button class="link" id="riskRestart" type="button" title="Count today and this week from your balance right now">Restart count</button></div>
      <div class="r-grid">
        <label class="r-field"><span>Daily loss limit</span><span class="r-money"><input id="rDailyLoss" type="number" min="1" step="1" placeholder="Off"></span></label>
        <label class="r-field"><span>Weekly loss limit</span><span class="r-money"><input id="rWeeklyLoss" type="number" min="1" step="1" placeholder="Off"></span></label>
        <label class="r-field"><span>Daily profit target</span><span class="r-money"><input id="rDailyProfit" type="number" min="1" step="1" placeholder="Off"></span></label>
        <label class="r-field"><span>Weekly profit target</span><span class="r-money"><input id="rWeeklyProfit" type="number" min="1" step="1" placeholder="Off"></span></label>
        <label class="r-field"><span>Max quantity per trade</span><input id="rMaxQty" type="number" min="1" step="1" placeholder="No limit"></label>
        <label class="r-field"><span>Lock for (hours)</span><input id="rLockHours" type="number" min="0.25" max="72" step="0.25" placeholder="4"></label>
      </div>
      <label class="r-toggle">
        <span class="r-toggle-text"><b>Prevent changes while locked</b><small>Limits can't be edited or turned off until a lock ends.</small></span>
        <span class="switch"><input type="checkbox" id="rPrevent" role="switch" aria-label="Prevent changes while locked"><span class="track"><span class="knob"></span></span></span>
      </label>
      <button class="r-save" id="riskSave" type="button">Save</button>
      <p class="note" id="riskMsg" hidden></p>
    </section>
    <div class="r-row" id="riskLockNowBox">
      <span class="r-unit">Lock now for</span>
      <input id="rLockNowHours" type="number" min="0.25" max="72" step="0.25" value="4" aria-label="Hours">
      <span class="r-unit">hours</span>
      <button class="r-lockbtn" id="riskLockNow" type="button">Lock trading</button>
    </div>
  </div>
</div>
<script src="../shared/skins.js"></script>
<script src="../shared/chrome-gl.js"></script>
<script src="../shared/scenes.js"></script>
<script src="../shared/media-store.js"></script>
<script src="popup.js"></script>
<script src="risk.js"></script>
</body>
</html>
