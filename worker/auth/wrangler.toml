name = "ezpayouts-auth"
main = "auth-worker.js"
compatibility_date = "2025-01-01"

# Deploys to the default ezpayouts-auth.<your-subdomain>.workers.dev URL.
# Before the first deploy:
#   1. cd worker/auth
#   2. npx wrangler kv namespace create ACCOUNTS
#      (paste the returned id below)
#   3. npx wrangler deploy
[[kv_namespaces]]
binding = "ACCOUNTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional: enables trade screenshots syncing across devices instead of
# staying local-only to the browser they were uploaded from. Before the
# first deploy:
#   1. cd worker/auth
#   2. npx wrangler r2 bucket create ezpayouts-images
# No further config needed — unlike the vars below, nothing here is
# account-specific. Until this bucket exists, /images/* responds 501.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "ezpayouts-images"

# Optional: enables "Sign in with Google" / "Sign in with Apple". Neither
# value is secret — both are just the OAuth client identifier each provider
# hands you when you register the app, the same string the client-side JS
# sends along in the auth request. ID-token verification needs no client
# secret at all (see verifyIdToken in auth-worker.js), so nothing sensitive
# lives in this file. Leave a var unset/empty and that provider's endpoint
# responds 501 instead of pretending to work.
#
# Google: console.cloud.google.com -> APIs & Services -> Credentials ->
#   OAuth client ID (type: Web application). Add this site's origin under
#   "Authorized JavaScript origins" and <origin>/oauth-callback.html under
#   "Authorized redirect URIs".
# Apple: developer.apple.com -> Certificates, IDs & Profiles -> Identifiers ->
#   Services IDs. Enable "Sign in with Apple", and under its configuration
#   add this site's domain and <origin>/oauth-callback.html as the return URL.
[vars]
GOOGLE_CLIENT_ID = "590928448638-eqaif9bhks2o0j2foba3l7ks0if4odt3.apps.googleusercontent.com"
APPLE_CLIENT_ID = ""
