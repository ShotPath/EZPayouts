name = "ezpayouts-tradovate"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
ALLOWED_ORIGIN = "https://ezpayouts.xyz"

# Created by `wrangler kv namespace create SESSIONS` — paste the id it prints
# into the line below before deploying.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
