<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Signing in…</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#05070c; color:#8d94a6; font-family:'IBM Plex Sans','Segoe UI',sans-serif; font-size:13px; }
</style>
</head>
<body>
<p id="msg">Finishing sign-in…</p>
<script>
// Popup target for the Google OAuth implicit flow (see startGoogleSignIn in
// account.js): Google redirects here with the ID token in the URL fragment
// after the user approves. This page's only job is to hand that token back
// to the window that opened it, then close itself — it holds no logic of
// its own worth auditing beyond "read the fragment, postMessage, close".
(function(){
  "use strict";
  var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  var payload = {
    source: "ezpayouts-oauth-callback",
    provider: "google",
    idToken: params.get("id_token") || null,
    state: params.get("state") || null,
    error: params.get("error") || null,
  };
  if (window.opener){
    window.opener.postMessage(payload, window.location.origin);
    document.getElementById("msg").textContent = payload.error ? "Sign-in was cancelled — you can close this window." : "Signed in — you can close this window.";
    setTimeout(function(){ window.close(); }, payload.error ? 600 : 250);
  } else {
    document.getElementById("msg").textContent = "This page should be opened as a popup. You can close this window.";
  }
})();
</script>
</body>
</html>
